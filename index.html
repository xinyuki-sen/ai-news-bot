<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chrono — Real-Time AI Intelligence</title>
  <meta name="description" content="Chrono — Real-time AI intelligence, breaking research, frontier model benchmarks, and tools. Refreshes hourly.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chrono — Real-Time AI Intelligence">
  <meta property="og:description" content="Chrono — Real-time AI intelligence, breaking research, frontier model benchmarks, and tools.">
  <meta property="og:url" content="https://xinyuki-sen.github.io/chrono/index.html">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" href="assets/robot_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Variables ──────────────────────────────────────────────────── */
    :root {
      --bg:          #0a0e14;
      --surface:     #12161e;
      --surface2:    #1a1f2b;
      --border:      #1e2430;
      --text:        #b0b8c8;
      --text-strong: #e2e8f0;
      --text-muted:  #636d80;
      --accent:      #6c9cff;
      --accent2:     #a78bfa;
      --radius:      16px;
      --panel-w:     360px;
    }
    [data-theme="light"] {
      --bg:          #f8f9fc;
      --surface:     #ffffff;
      --surface2:    #f0f2f5;
      --border:      #e5e7eb;
      --text:        #374151;
      --text-strong: #111827;
      --text-muted:  #9ca3af;
      --accent:      #4f7eff;
      --accent2:     #7c3aed;
    }

    /* ── Reset & Performance Baseline ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 72px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 8px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 40;
      contain: layout paint;
    }
    .sidebar .logo { margin-bottom: 16px; }
    .logo-img {
      width: 40px; height: 40px;
      border-radius: 12px;
      object-fit: cover;
      transform: translateZ(0);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .logo-img:hover { transform: scale(1.08) rotate(-3deg); }
    .sidebar .spacer { flex: 1; }
    .sb-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .sb-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sb-btn:hover, .sb-btn.active { background: var(--surface2); color: var(--accent); }
    .sb-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 10px); top: 50%;
      transform: translateY(-50%);
      background: var(--surface2); color: var(--text-strong);
      border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 8px;
      font-size: 0.7em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.12s ease; z-index: 100;
    }
    .sb-btn[data-tooltip]:hover::after { opacity: 1; }
    .sb-badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }

    /* ── Main ───────────────────────────────────────────────────────── */
    .main { flex: 1; padding: 36px 40px; min-width: 0; }
    h1 {
      font-size: 1.6em; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .date { color: var(--text-muted); font-size: 0.8em; margin-bottom: 24px; font-weight: 400; }

    /* ── Search ─────────────────────────────────────────────────────── */
    .topbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .search {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 80px 10px 40px;
      color: var(--text); font-size: 0.85em; font-family: inherit;
      outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,156,255,0.12); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .search-shortcut {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: .7em; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 2px 6px; border-radius: 6px; pointer-events: none;
    }
    .search::placeholder { color: var(--text-muted); }

    /* ── Tabs ───────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab {
      padding: 5px 14px; border-radius: 20px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.75em; font-weight: 500;
      cursor: pointer; transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      user-select: none; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .tab-count { display: inline-block; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 0 6px; font-size: 0.85em; margin-left: 4px; }
    .tab.active .tab-count { background: rgba(255,255,255,0.25); }

    /* ── Executive Brief / Top 3 Bento Hero ────────────────────────── */
    .top-picks { margin-bottom: 32px; }
    .top-picks-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .top-picks-title {
      font-size: 0.78em; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-strong);
      display: flex; align-items: center; gap: 8px;
    }
    .top-picks-title svg { width: 16px; height: 16px; fill: var(--accent); stroke: var(--accent); }
    .top-picks-badge {
      font-size: 0.68em; padding: 3px 10px; border-radius: 12px;
      background: rgba(108,156,255,0.12); color: var(--accent);
      border: 1px solid rgba(108,156,255,0.25); font-weight: 600;
    }
    .top-picks-bento {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
    }
    .top-hero-card {
      background: linear-gradient(145deg, rgba(108,156,255,0.07), var(--surface));
      border: 1.5px solid rgba(108,156,255,0.55);
      border-radius: var(--radius);
      padding: 24px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transform: translate3d(0,0,0);
      will-change: transform, box-shadow;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.15s ease;
      contain: content;
    }
    .top-hero-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,156,255,0.15), 0 12px 36px rgba(0,0,0,0.28);
      transform: translateY(-2px);
    }
    .top-hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent); margin-bottom: 12px;
    }
    .top-hero-title {
      font-size: 1.15em; font-weight: 700; color: var(--text-strong);
      line-height: 1.4; margin-bottom: 12px;
    }
    .top-hero-summary {
      font-size: 0.82em; color: var(--text); line-height: 1.65;
      margin-bottom: 16px; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .top-sub-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-sub-card {
      background: var(--surface);
      border: 1.5px solid rgba(108,156,255,0.28);
      border-left: 3px solid rgba(108,156,255,0.7);
      border-radius: var(--radius);
      padding: 18px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      flex: 1;
      transform: translate3d(0,0,0);
      will-change: transform, box-shadow;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.15s ease, background-color 0.15s ease;
      contain: content;
    }
    .top-sub-card:hover {
      background: var(--surface2);
      border-color: rgba(108,156,255,0.65);
      border-left-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(108,156,255,0.1), 0 8px 24px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }
    .top-sub-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.68em; font-weight: 700; color: var(--text-muted);
      margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .top-sub-title {
      font-size: 0.9em; font-weight: 600; color: var(--text-strong);
      line-height: 1.4; margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .top-card-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.72em; color: var(--text-muted);
    }
    .top-card-meta .pill {
      background: var(--surface2); padding: 2px 8px; border-radius: 12px;
      font-weight: 500; color: var(--text-muted);
    }
    @media (max-width: 768px) {
      .top-picks-bento { grid-template-columns: 1fr; }
      .top-hero-card { padding: 20px; }
    }

    /* ── Grid ───────────────────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

    /* ── Card (GPU-accelerated, butter-smooth) ───────────────────────── */
    .card {
      background: var(--surface);
      border: none;
      border-radius: var(--radius);
      padding: 22px 20px;
      cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 120px; position: relative;
      transform: translate3d(0, 0, 0);
      will-change: transform, box-shadow;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.15s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      contain: content;
    }
    .card:hover {
      background: var(--surface2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      transform: translateY(-2px);
    }
    .card.selected { box-shadow: 0 0 0 2px var(--accent2), 0 4px 20px rgba(167,139,250,0.15); }

    .card-bookmark {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); opacity: 0; transition: opacity 0.12s ease, color 0.12s ease; padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .card-bookmark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; pointer-events: none; }
    .card:hover .card-bookmark, .card-bookmark.bookmarked { opacity: 1; }
    .card-bookmark.bookmarked { color: var(--accent); }
    .card-bookmark.bookmarked svg { fill: var(--accent); }

    .card-title {
      color: var(--text-strong); font-weight: 600; font-size: 0.88em;
      line-height: 1.5; padding-right: 20px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 6px; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted);
      font-size: 0.68em; font-weight: 500; flex-shrink: 0;
    }
    .card-time { color: var(--text-muted); font-size: 0.68em; }

    /* ── Skeleton ───────────────────────────────────────────────────── */
    .skeleton-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 22px 20px; min-height: 120px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .skel {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Error / Empty ─────────────────────────────────────────────── */
    .error-state { text-align: center; padding: 60px 20px; display: none; }
    .error-state.show { display: block; }
    .error-state .err-icon { font-size: 2em; margin-bottom: 12px; opacity: 0.5; }
    .error-state p { color: var(--text-muted); margin-bottom: 16px; font-size: 0.9em; }
    .btn-retry {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 8px 22px; font-weight: 600; cursor: pointer; font-size: 0.85em; font-family: inherit;
    }
    .empty-state { grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0; display: none; font-size: 0.9em; }
    .empty-state.show { display: block; }

    /* ── Antigravity-Style Resizable Panel ───────────────────────────── */
    .panel-backdrop { display: none; }
    .panel {
      width: var(--panel-w);
      min-width: 280px;
      max-width: 650px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      contain: layout paint;
    }
    .panel-resizer {
      position: absolute;
      left: -4px;
      top: 0;
      bottom: 0;
      width: 8px;
      cursor: col-resize;
      z-index: 50;
      transition: background-color 0.12s ease;
    }
    .panel-resizer:hover, .panel-resizer.dragging {
      background: var(--accent);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
      flex-shrink: 0;
    }
    .panel-header-title {
      font-size: 0.75em;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s ease, color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .panel-tool-btn:hover, .panel-tool-btn:active {
      background: var(--surface2);
      color: var(--text-strong);
    }
    .panel-tool-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; pointer-events: none; }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .panel-empty {
      color: var(--text-muted);
      font-size: 0.85em;
      text-align: center;
      margin-top: 40px;
    }
    .panel-empty .panel-hint { font-size: 1.8em; margin-bottom: 10px; opacity: 0.3; }
    .panel h3 { color: var(--text-strong); font-size: 1.05em; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
    .panel .panel-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .panel .panel-src, .panel .panel-time { color: var(--text-muted); font-size: 0.75em; }
    .panel .panel-cat { padding: 2px 10px; border-radius: 20px; background: var(--surface2); color: var(--text-muted); font-size: 0.7em; font-weight: 500; }
    .panel-summary { color: var(--text); font-size: 0.85em; line-height: 1.75; margin-bottom: 20px; border-left: 2px solid var(--accent); padding-left: 14px; font-weight: 400; }
    .panel a.open-btn {
      display: block; text-align: center; background: var(--accent); color: #fff;
      padding: 10px; border-radius: 10px; text-decoration: none;
      font-weight: 600; font-size: 0.85em; transition: opacity 0.15s ease; margin-bottom: 8px;
    }
    .panel a.open-btn:hover { opacity: 0.88; }
    .panel .bm-btn {
      display: block; width: 100%; text-align: center;
      background: var(--surface2); color: var(--text-muted);
      padding: 8px; border-radius: 10px; border: none;
      font-size: 0.8em; font-weight: 500; cursor: pointer; transition: color 0.15s ease; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .panel .bm-btn:hover { color: var(--accent); }
    .panel .bm-btn.bookmarked { color: var(--accent); }

    /* ── Bookmarks & Command Palette Overlay ────────────────────────── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; z-index: 120; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 20px; }
    .overlay.show, .overlay.active { display: flex; }
    .overlay-box, .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      width: 100%; max-width: 540px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .overlay-box { padding: 24px; }
    .overlay-box h2 { color: var(--text-strong); font-size: 1em; font-weight: 600; margin-bottom: 16px; }
    .bm-item { padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .bm-item:last-child { border-bottom: none; }
    .bm-item:hover .bm-item-title { color: var(--accent); }
    .bm-item-title { color: var(--text-strong); font-size: 0.85em; font-weight: 600; margin-bottom: 3px; }
    .bm-item-meta { color: var(--text-muted); font-size: 0.72em; }
    .bm-empty { color: var(--text-muted); font-size: 0.85em; text-align: center; padding: 30px 0; }
    .overlay-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 1.1em; cursor: pointer; }

    /* Command Palette Specific */
    .cmd-palette-input-wrap { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
    .cmd-palette-input-wrap svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .cmd-palette-input { flex: 1; background: transparent; border: none; color: var(--text-strong); font-size: 1em; outline: none; font-family: inherit; }
    .cmd-badge { font-size: .65em; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 2px 6px; border-radius: 6px; }
    .cmd-results { max-height: 380px; overflow-y: auto; padding: 8px; }
    .cmd-group-title { font-size: .65em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 8px 10px 4px 10px; }
    .cmd-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background-color .1s; gap: 10px; color: var(--text); text-decoration: none; }
    .cmd-item:hover, .cmd-item.selected { background: var(--surface2); color: var(--text-strong); }
    .cmd-item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cmd-item-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: .9em; }
    .cmd-item-text { min-width: 0; }
    .cmd-item-title { font-size: .85em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-strong); }
    .cmd-item-sub { font-size: .7em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cmd-item-tag { font-size: .65em; padding: 2px 6px; border-radius: 6px; background: var(--surface2); color: var(--text-muted); flex-shrink: 0; }

    /* ── Mobile & Android Compatibility (60/120fps physics) ────────── */
    .mobile-handle { display: none; }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        padding-bottom: 64px;
      }
      .sidebar {
        width: 100%;
        height: 60px;
        position: fixed;
        bottom: 0;
        top: auto;
        left: 0;
        right: 0;
        flex-direction: row;
        justify-content: space-around;
        padding: 0 16px;
        border-top: 1px solid var(--border);
        border-right: none;
        background: rgba(18, 22, 30, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 90;
      }
      [data-theme="light"] .sidebar {
        background: rgba(255, 255, 255, 0.96);
      }
      .sidebar .logo, .sidebar .spacer { display: none; }
      .sb-btn { width: 44px; height: 44px; }
      .sb-btn[data-tooltip]::after { display: none; }

      .main {
        padding: 24px 16px 32px 16px;
        max-width: 100%;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      /* Mobile Detail Bottom Sheet */
      .panel-resizer { display: none; }
      .panel-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 95;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .panel-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
      .panel {
        position: fixed;
        bottom: 0;
        top: auto;
        left: 0;
        right: 0;
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        height: 80vh;
        max-height: 85vh;
        min-height: auto;
        border-radius: 24px 24px 0 0;
        border-top: 1px solid var(--border);
        border-left: none;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        z-index: 100;
        transform: translate3d(0, 105%, 0);
        will-change: transform;
        transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .panel.active {
        transform: translate3d(0, 0, 0);
      }
      .mobile-handle {
        display: block;
        width: 44px;
        height: 5px;
        background: var(--text-muted);
        opacity: 0.4;
        border-radius: 6px;
        margin: 12px auto 6px auto;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
    }
  </style>
</head>
<body>

  <!-- ── Sidebar / Mobile Bottom Nav ──────────────────────────────── -->
  <nav class="sidebar" aria-label="Main Navigation">
    <div class="logo"><img src="assets/sidebar_logo.png" alt="Logo" class="logo-img"></div>
    <a href="index.html" class="sb-btn active" data-tooltip="News"><svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg></a>
    <a href="tools.html" class="sb-btn" data-tooltip="Tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></a>
    <a href="prompts.html" class="sb-btn" data-tooltip="Prompts"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
    <a href="models.html" class="sb-btn" data-tooltip="Models Leaderboard"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><path d="M7 8h10"/><path d="M7 12h6"/></svg></a>
    <a href="concepts.html" class="sb-btn" data-tooltip="AI Core Concepts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-25 12 12)"/></svg></a>
    <button class="sb-btn" id="btnCmdPalette" data-tooltip="Command Palette (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="sb-btn" id="btnBookmarks" data-tooltip="Bookmarks"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="sb-badge" id="bmBadge" style="display:none;"></span></button>
    <div class="spacer"></div>
    <button class="sb-btn" id="btnTheme" data-tooltip="Theme"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </nav>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <main class="main">
    <h1>Chrono</h1>
    <div class="date" id="dateBar">Real-Time AI Intelligence · Frontier Research, Tools & Models</div>

    <section class="top-picks" id="topPicksSection" style="display:none;">
      <div class="top-picks-header">
        <div class="top-picks-title">
          <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Executive Brief · Top 3 Breakthroughs</span>
        </div>
        <span class="top-picks-badge">Curated Hourly</span>
      </div>
      <div class="top-picks-bento" id="topPicks"></div>
    </section>

    <div class="topbar">
      <div class="search-wrap">
        <label for="search">Search articles</label>
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input class="search" id="search" type="search" placeholder="Search articles…" autocomplete="off">
        <span class="search-shortcut">⌘K</span>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="grid" id="grid" role="list"></div>

    <div class="error-state" id="errorState" role="alert">
      <div class="err-icon">⚠</div>
      <p>Could not load news. Check your connection.</p>
      <button class="btn-retry" id="btnRetry">Retry</button>
    </div>
  </main>

  <!-- ── Mobile Backdrop ─────────────────────────────────────────── -->
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <!-- ── Resizable Antigravity-Style Panel ────────────────────────── -->
  <aside class="panel" id="panel">
    <div class="panel-resizer" id="panelResizer" title="Drag to resize panel"></div>
    <div class="mobile-handle"></div>
    <div class="panel-header">
      <div class="panel-header-title">
        <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        <span>Preview</span>
      </div>
      <div class="panel-header-actions">
        <button class="panel-tool-btn" id="panelCloseBtn" title="Close panel">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="panel-empty">
        <div class="panel-hint">←</div>
        Click an article to preview details here.
      </div>
    </div>
  </aside>

  <!-- ── Universal Command Palette Modal ────────────────────────────── -->
  <div class="overlay" id="cmdOverlay" role="dialog" aria-modal="true">
    <div class="modal" style="max-width: 580px;">
      <div class="cmd-palette-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="cmd-palette-input" id="cmdInput" placeholder="Type a command or search news, tools, prompts, models…" autocomplete="off">
        <span class="cmd-badge">ESC</span>
      </div>
      <div class="cmd-results" id="cmdResults"></div>
    </div>
  </div>

  <!-- ── Bookmarks Overlay ────────────────────────────────────────── -->
  <div class="overlay" id="bmOverlay">
    <div class="overlay-box">
      <button class="overlay-close" id="bmClose">✕</button>
      <h2>Bookmarks</h2>
      <div id="bmList"></div>
    </div>
  </div>

<script>
/* ── State ────────────────────────────────────────────────────────── */
let allArticles = [];
let activeCategory = 'All';
let selectedId = null;
let bookmarks = JSON.parse(localStorage.getItem('aind_bookmarks') || '[]');

/* ── Panel Width Persistence & High-FPS Resize Logic ──────────────── */
const panel = document.getElementById('panel');
const resizer = document.getElementById('panelResizer');
const backdrop = document.getElementById('panelBackdrop');
const panelCloseBtn = document.getElementById('panelCloseBtn');

const savedPanelWidth = localStorage.getItem('aind_panel_width');
if (savedPanelWidth && window.innerWidth > 768) {
  panel.style.width = savedPanelWidth + 'px';
}

let isResizing = false;
let rafId = null;

if (resizer) {
  resizer.addEventListener('mousedown', e => {
    isResizing = true;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  }, { passive: true });

  document.addEventListener('mousemove', e => {
    if (!isResizing) return;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      const newWidth = window.innerWidth - e.clientX;
      if (newWidth >= 280 && newWidth <= 650) {
        panel.style.width = newWidth + 'px';
        localStorage.setItem('aind_panel_width', newWidth);
      }
    });
  }, { passive: true });

  document.addEventListener('mouseup', () => {
    if (isResizing) {
      isResizing = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      if (rafId) cancelAnimationFrame(rafId);
    }
  }, { passive: true });
}

function closePanel() {
  panel.classList.remove('active');
  backdrop.classList.remove('active');
  selectedId = null;
  const prevSelected = document.querySelector('.card.selected');
  if (prevSelected) prevSelected.classList.remove('selected');
  document.getElementById('panelBody').innerHTML = `
    <div class="panel-empty">
      <div class="panel-hint">←</div>
      Click an article to preview details here.
    </div>
  `;
}

panelCloseBtn.addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);

const mobileHandle = document.querySelector('.mobile-handle');
if (mobileHandle) mobileHandle.addEventListener('click', closePanel);

// Optimized touch swipe down
let touchStartY = 0;
panel.addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

panel.addEventListener('touchmove', e => {
  const touchY = e.touches[0].clientY;
  const diff = touchY - touchStartY;
  if (diff > 60 && document.getElementById('panelBody').scrollTop <= 0) {
    closePanel();
  }
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePanel();
    document.getElementById('bmOverlay').classList.remove('show');
  }
});

/* ── Theme ────────────────────────────────────────────────────────── */
const saved = localStorage.getItem('aind_theme') || 'dark';
document.documentElement.setAttribute('data-theme', saved);
const btnTheme = document.getElementById('btnTheme');
const themeIcon = document.getElementById('themeIcon');
function setThemeIcon(t) {
  themeIcon.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}
setThemeIcon(saved);
btnTheme.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('aind_theme', next);
  setThemeIcon(next);
});

/* ── Helpers ──────────────────────────────────────────────────────── */
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  return `${Math.floor(h / 24)}d`;
}
function formatDate(iso) {
  return new Date(iso).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
}
function isBookmarked(id) { return bookmarks.includes(id); }
function toggleBookmark(id) {
  bookmarks = isBookmarked(id) ? bookmarks.filter(b => b !== id) : [...bookmarks, id];
  localStorage.setItem('aind_bookmarks', JSON.stringify(bookmarks));
  refreshBookmarkUI();
}
function refreshBookmarkUI() {
  document.getElementById('bmBadge').style.display = bookmarks.length ? '' : 'none';
  document.querySelectorAll('[data-bm-id]').forEach(btn => {
    const id = +btn.dataset.bmId;
    const bm = isBookmarked(id);
    btn.classList.toggle('bookmarked', bm);
    const svg = btn.querySelector('svg');
    if (svg) svg.style.fill = bm ? 'var(--accent)' : 'none';
  });
  const p = document.getElementById('panelBmBtn');
  if (p && selectedId !== null) {
    p.textContent = isBookmarked(selectedId) ? '★ Bookmarked' : '☆ Bookmark';
    p.classList.toggle('bookmarked', isBookmarked(selectedId));
  }
}

/* ── Skeleton ─────────────────────────────────────────────────────── */
function renderSkeletons(n = 9) {
  document.getElementById('grid').innerHTML = Array.from({ length: n }, () => `
    <div class="skeleton-card">
      <div class="skel" style="height:13px;width:90%"></div>
      <div class="skel" style="height:13px;width:70%"></div>
      <div style="flex:1"></div>
      <div class="skel" style="height:20px;width:60px;border-radius:20px"></div>
    </div>
  `).join('');
}

/* ── Top Picks Bento Hero ─────────────────────────────────────────── */
function renderTopPicks(topPickIds) {
  const section = document.getElementById('topPicksSection');
  const container = document.getElementById('topPicks');
  if (!topPickIds || !topPickIds.length) { section.style.display = 'none'; return; }
  const picks = topPickIds.map(id => allArticles.find(a => a.id === id)).filter(Boolean);
  if (!picks.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  const [p1, p2, p3] = picks;
  container.innerHTML = `
    <div class="top-hero-card" data-id="${p1.id}" tabindex="0" role="button" aria-label="Top story: ${p1.title}">
      <div class="top-hero-badge">👑 #1 · ${p1.category}</div>
      <div class="top-hero-title">${p1.title}</div>
      <div class="top-hero-summary">${p1.summary || ''}</div>
      <div class="top-card-meta">
        <span>${p1.source}</span>
        <span class="pill">${timeAgo(p1.published_at)}</span>
      </div>
    </div>
    <div class="top-sub-column">
      ${p2 ? `<div class="top-sub-card" data-id="${p2.id}" tabindex="0" role="button" aria-label="#2 story: ${p2.title}">
        <div class="top-sub-badge">#2 · ${p2.category}</div>
        <div class="top-sub-title">${p2.title}</div>
        <div class="top-card-meta"><span>${p2.source}</span><span class="pill">${timeAgo(p2.published_at)}</span></div>
      </div>` : ''}
      ${p3 ? `<div class="top-sub-card" data-id="${p3.id}" tabindex="0" role="button" aria-label="#3 story: ${p3.title}">
        <div class="top-sub-badge">#3 · ${p3.category}</div>
        <div class="top-sub-title">${p3.title}</div>
        <div class="top-card-meta"><span>${p3.source}</span><span class="pill">${timeAgo(p3.published_at)}</span></div>
      </div>` : ''}
    </div>`;
  container.querySelectorAll('[data-id]').forEach(card => {
    const activate = () => { const id = +card.dataset.id; selectedId = id; openPanel(id); };
    card.addEventListener('click', activate);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } });
  });
}

/* ── Fast Grid Rendering with Event Delegation ─────────────────────── */
function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return allArticles.filter(a => {
    const matchCat = activeCategory === 'All' || a.category === activeCategory;
    const matchQ = !q || a.title.toLowerCase().includes(q) || a.source.toLowerCase().includes(q) || a.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const articles = getFiltered();
  if (!articles.length) {
    grid.innerHTML = '<div class="empty-state show">No articles found.</div>';
    return;
  }

  grid.innerHTML = articles.map(a => `
    <article class="card${selectedId === a.id ? ' selected' : ''}" data-id="${a.id}" tabindex="0">
      <button class="card-bookmark${isBookmarked(a.id) ? ' bookmarked' : ''}" data-bm-id="${a.id}" aria-label="Bookmark">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div class="card-title">${a.title}</div>
      <div class="card-footer">
        <span class="badge">${a.category}</span>
        <span class="card-time">${timeAgo(a.published_at)}</span>
      </div>
    </article>
  `).join('');
}

// Single Event Delegation listener for high performance
const gridElem = document.getElementById('grid');
gridElem.addEventListener('click', e => {
  const bmBtn = e.target.closest('.card-bookmark');
  if (bmBtn) {
    e.stopPropagation();
    toggleBookmark(+bmBtn.dataset.bmId);
    return;
  }
  const card = e.target.closest('.card');
  if (card) {
    const id = +card.dataset.id;
    selectedId = id;
    openPanel(id);
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
  }
});

gridElem.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const card = e.target.closest('.card');
    if (card) card.click();
  }
});

/* ── Tabs ─────────────────────────────────────────────────────────── */
function renderTabs() {
  const counts = {};
  allArticles.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort()];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = cats.map(cat => {
    const count = cat === 'All' ? allArticles.length : counts[cat];
    return `<button class="tab${activeCategory === cat ? ' active' : ''}" data-cat="${cat}">${cat}<span class="tab-count">${count}</span></button>`;
  }).join('');
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) {
    activeCategory = tab.dataset.cat;
    renderTabs();
    renderGrid();
  }
});

/* ── Top Picks ────────────────────────────────────────────────────── */
function renderTopPicks(ids) {
  const picks = ids.map(id => allArticles.find(a => a.id === id)).filter(Boolean);
  if (!picks.length) return;
  document.getElementById('topPicksSection').style.display = '';
  document.getElementById('topPicks').innerHTML = picks.map((a, i) => `
    <div class="top-card" data-id="${a.id}" tabindex="0">
      <span class="rank">#${i+1}</span>
      <div>
        <div class="tc-title">${a.title}</div>
        <div class="tc-meta">${a.source} · ${timeAgo(a.published_at)}</div>
      </div>
    </div>
  `).join('');
}

document.getElementById('topPicks').addEventListener('click', e => {
  const card = e.target.closest('.top-card');
  if (card) {
    selectedId = +card.dataset.id;
    openPanel(selectedId);
  }
});

/* ── Panel ────────────────────────────────────────────────────────── */
function openPanel(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  document.getElementById('panelBody').innerHTML = `
    <h3>${a.title}</h3>
    <div class="panel-meta">
      <span class="panel-cat">${a.category}</span>
      <span class="panel-src">${a.source}</span>
      <span class="panel-time">${timeAgo(a.published_at)}</span>
    </div>
    <p class="panel-summary">${a.summary || 'No summary available.'}</p>
    <a class="open-btn" href="${a.url}" target="_blank" rel="noopener">Open Article ↗</a>
    <button class="bm-btn${isBookmarked(id) ? ' bookmarked' : ''}" id="panelBmBtn">
      ${isBookmarked(id) ? '★ Bookmarked' : '☆ Bookmark'}
    </button>
    <p style="color:var(--text-muted);font-size:0.7em;margin-top:14px">Published: ${formatDate(a.published_at)}</p>
  `;
  panel.classList.add('active');
  backdrop.classList.add('active');
  document.getElementById('panelBmBtn').addEventListener('click', () => toggleBookmark(id));
}

/* ── Bookmarks Overlay ────────────────────────────────────────────── */
document.getElementById('btnBookmarks').addEventListener('click', () => {
  const overlay = document.getElementById('bmOverlay');
  const list = document.getElementById('bmList');
  if (!bookmarks.length) {
    list.innerHTML = '<div class="bm-empty">No bookmarks yet.</div>';
  } else {
    const saved = bookmarks.map(id => allArticles.find(a => a.id === id)).filter(Boolean);
    list.innerHTML = saved.map(a => `
      <div class="bm-item" data-id="${a.id}" tabindex="0">
        <div class="bm-item-title">${a.title}</div>
        <div class="bm-item-meta">${a.source} · ${a.category}</div>
      </div>
    `).join('');
  }
  overlay.classList.add('show');
});

document.getElementById('bmList').addEventListener('click', e => {
  const item = e.target.closest('.bm-item');
  if (item) {
    document.getElementById('bmOverlay').classList.remove('show');
    selectedId = +item.dataset.id;
    openPanel(selectedId);
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    const targetCard = document.querySelector(`.card[data-id="${selectedId}"]`);
    if (targetCard) targetCard.classList.add('selected');
  }
});

document.getElementById('bmClose').addEventListener('click', () => document.getElementById('bmOverlay').classList.remove('show'));
document.getElementById('bmOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });

/* ── Optimized Fast Search ───────────────────────────────────────── */
let st;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(st);
  st = setTimeout(renderGrid, 120);
});

/* ── Universal Command Palette Logic ───────────────────────────── */
let cmdData = { news: [], tools: [], prompts: [], models: [], concepts: [] };
let cmdDataLoaded = false;
let activeCmdIndex = 0;
const cmdOverlay = document.getElementById('cmdOverlay');
const cmdInput = document.getElementById('cmdInput');
const cmdResults = document.getElementById('cmdResults');
const btnCmdPalette = document.getElementById('btnCmdPalette');

async function ensureCmdData() {
  if (cmdDataLoaded) return;
  try {
    const [nRes, tRes, pRes, mRes, cRes] = await Promise.all([
      fetch('news.json').catch(() => null),
      fetch('tools.json').catch(() => null),
      fetch('prompts.json').catch(() => null),
      fetch('models.json').catch(() => null),
      fetch('concepts.json').catch(() => null)
    ]);
    if (nRes && nRes.ok) { const d = await nRes.json(); cmdData.news = d.articles || []; }
    if (tRes && tRes.ok) cmdData.tools = await tRes.json();
    if (pRes && pRes.ok) cmdData.prompts = await pRes.json();
    if (mRes && mRes.ok) cmdData.models = await mRes.json();
    if (cRes && cRes.ok) cmdData.concepts = await cRes.json();
    cmdDataLoaded = true;
  } catch (e) {
    console.warn('Failed loading cmd palette data', e);
  }
}

function openCmdPalette() {
  cmdOverlay.classList.add('active');
  cmdInput.value = '';
  ensureCmdData().then(() => renderCmdResults(''));
  setTimeout(() => cmdInput.focus(), 50);
}

function closeCmdPalette() {
  cmdOverlay.classList.remove('active');
}

function renderCmdResults(query) {
  const q = query.toLowerCase().trim();
  let resultsHtml = '';
  let items = [];

  const actions = [
    { type: 'action', title: 'Go to News Digest', sub: 'index.html', link: 'index.html', icon: '📰' },
    { type: 'action', title: 'Go to AI Tools Directory', sub: 'tools.html', link: 'tools.html', icon: '🛠️' },
    { type: 'action', title: 'Go to Prompt Library', sub: 'prompts.html', link: 'prompts.html', icon: '💬' },
    { type: 'action', title: 'Go to Models Leaderboard', sub: 'models.html', link: 'models.html', icon: '📊' },
    { type: 'action', title: 'Go to AI Core Concepts & Orbit', sub: 'concepts.html', link: 'concepts.html', icon: '🪐' },
    { type: 'action_theme', title: 'Toggle Theme (Dark / Light)', sub: 'Action', icon: '🌓' },
  ];

  if (!q) {
    resultsHtml += `<div class="cmd-group-title">Quick Actions</div>`;
    actions.forEach((a, i) => {
      items.push(a);
      resultsHtml += `
        <div class="cmd-item ${i === 0 ? 'selected' : ''}" data-cmd-idx="${i}" data-action="${a.type}" data-link="${a.link || ''}">
          <div class="cmd-item-left">
            <div class="cmd-item-icon">${a.icon}</div>
            <div class="cmd-item-text">
              <div class="cmd-item-title">${a.title}</div>
              <div class="cmd-item-sub">${a.sub}</div>
            </div>
          </div>
          <span class="cmd-item-tag">Action</span>
        </div>
      `;
    });
  } else {
    const matchActions = actions.filter(a => a.title.toLowerCase().includes(q) || a.sub.toLowerCase().includes(q));
    const matchConcepts = (cmdData.concepts || []).filter(c => c.name.toLowerCase().includes(q) || (c.simple_definition && c.simple_definition.toLowerCase().includes(q)) || (c.category && c.category.toLowerCase().includes(q))).slice(0, 4);
    const matchNews = (cmdData.news.length ? cmdData.news : allArticles).filter(n => n.title.toLowerCase().includes(q)).slice(0, 4);
    const matchModels = cmdData.models.filter(m => m.name.toLowerCase().includes(q) || m.provider.toLowerCase().includes(q)).slice(0, 4);
    const matchTools = cmdData.tools.filter(t => t.title.toLowerCase().includes(q) || (t.category && t.category.toLowerCase().includes(q))).slice(0, 4);
    const matchPrompts = cmdData.prompts.filter(p => p.title.toLowerCase().includes(q)).slice(0, 4);

    if (matchActions.length) {
      resultsHtml += `<div class="cmd-group-title">Quick Actions</div>`;
      matchActions.forEach(a => {
        const idx = items.length;
        items.push(a);
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="${a.type}" data-link="${a.link || ''}">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">${a.icon}</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${a.title}</div>
                <div class="cmd-item-sub">${a.sub}</div>
              </div>
            </div>
            <span class="cmd-item-tag">Action</span>
          </div>
        `;
      });
    }

    if (matchConcepts.length) {
      resultsHtml += `<div class="cmd-group-title">AI Core Concepts & Orbit</div>`;
      matchConcepts.forEach(c => {
        const idx = items.length;
        items.push({ type: 'concept', data: c });
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="link" data-link="concepts.html">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">🪐</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${c.name}</div>
                <div class="cmd-item-sub">${c.category} · ${c.level || 'Concept'}</div>
              </div>
            </div>
            <span class="cmd-item-tag">Concept</span>
          </div>
        `;
      });
    }

    if (matchNews.length) {
      resultsHtml += `<div class="cmd-group-title">News Articles</div>`;
      matchNews.forEach(n => {
        const idx = items.length;
        items.push({ type: 'news', data: n });
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="news" data-id="${n.id}">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">📰</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${n.title}</div>
                <div class="cmd-item-sub">${n.source} · ${n.category}</div>
              </div>
            </div>
            <span class="cmd-item-tag">News</span>
          </div>
        `;
      });
    }

    if (matchModels.length) {
      resultsHtml += `<div class="cmd-group-title">AI Models</div>`;
      matchModels.forEach(m => {
        const idx = items.length;
        items.push({ type: 'model', data: m });
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="model" data-id="${m.id}">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">📊</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${m.name}</div>
                <div class="cmd-item-sub">${m.provider} · Elo ${m.arena_elo}</div>
              </div>
            </div>
            <span class="cmd-item-tag">Model</span>
          </div>
        `;
      });
    }

    if (matchTools.length) {
      resultsHtml += `<div class="cmd-group-title">AI Tools</div>`;
      matchTools.forEach(t => {
        const idx = items.length;
        items.push({ type: 'tool', data: t });
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="link" data-link="${t.link}">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">🛠️</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${t.title}</div>
                <div class="cmd-item-sub">${t.category || 'Tool'}</div>
              </div>
            </div>
            <span class="cmd-item-tag">Tool</span>
          </div>
        `;
      });
    }

    if (matchPrompts.length) {
      resultsHtml += `<div class="cmd-group-title">Prompts</div>`;
      matchPrompts.forEach(p => {
        const idx = items.length;
        items.push({ type: 'prompt', data: p });
        resultsHtml += `
          <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="link" data-link="prompts.html">
            <div class="cmd-item-left">
              <div class="cmd-item-icon">💬</div>
              <div class="cmd-item-text">
                <div class="cmd-item-title">${p.title}</div>
                <div class="cmd-item-sub">${p.category}</div>
              </div>
            </div>
            <span class="cmd-item-tag">Prompt</span>
          </div>
        `;
      });
    }

    if (!items.length) {
      resultsHtml = `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.85em;">No results found for "${query}"</div>`;
    }
  }

  cmdResults.innerHTML = resultsHtml;
  activeCmdIndex = 0;
}

cmdInput.addEventListener('input', e => renderCmdResults(e.target.value));

window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (cmdOverlay.classList.contains('active')) closeCmdPalette();
    else openCmdPalette();
    return;
  }
  if (e.key === 'Escape') {
    if (cmdOverlay.classList.contains('active')) { closeCmdPalette(); return; }
    if (document.getElementById('bmOverlay').classList.contains('show')) { document.getElementById('bmOverlay').classList.remove('show'); return; }
    if (panel.classList.contains('active')) { closePanel(); return; }
  }
  if (cmdOverlay.classList.contains('active')) {
    const items = cmdResults.querySelectorAll('.cmd-item');
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      items[activeCmdIndex]?.classList.remove('selected');
      activeCmdIndex = (activeCmdIndex + 1) % items.length;
      items[activeCmdIndex]?.classList.add('selected');
      items[activeCmdIndex]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      items[activeCmdIndex]?.classList.remove('selected');
      activeCmdIndex = (activeCmdIndex - 1 + items.length) % items.length;
      items[activeCmdIndex]?.classList.add('selected');
      items[activeCmdIndex]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      items[activeCmdIndex]?.click();
    }
  }
});

btnCmdPalette.addEventListener('click', openCmdPalette);
cmdOverlay.addEventListener('click', e => { if (e.target === cmdOverlay) closeCmdPalette(); });

cmdResults.addEventListener('click', e => {
  const item = e.target.closest('.cmd-item');
  if (!item) return;
  const action = item.dataset.action;
  if (action === 'action_theme') {
    toggleTheme();
    closeCmdPalette();
  } else if (action === 'news') {
    const id = +item.dataset.id;
    openPanel(id);
    closeCmdPalette();
  } else if (action === 'model') {
    window.location.href = 'models.html';
  } else if (action === 'link' || action === 'action') {
    const link = item.dataset.link;
    if (link) window.location.href = link;
  }
});

/* ── Load ─────────────────────────────────────────────────────────── */
async function loadNews() {
  renderSkeletons();
  document.getElementById('errorState').classList.remove('show');
  try {
    const res = await fetch('news.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allArticles = data.articles || [];
    const d = new Date(data.last_updated);
    document.getElementById('dateBar').textContent = `Updated ${d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })} · Hourly`;
    renderTopPicks(data.top_pick_ids || []);
    renderTabs();
    renderGrid();
    refreshBookmarkUI();
  } catch (err) {
    console.error(err);
    document.getElementById('grid').innerHTML = '';
    document.getElementById('errorState').classList.add('show');
  }
}
document.getElementById('btnRetry').addEventListener('click', loadNews);
loadNews();
</script>
