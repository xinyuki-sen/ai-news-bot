<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI News Digest</title>
  <meta name="description" content="Daily AI news digest — top stories, research tools, and breakthroughs curated automatically. Refreshes hourly.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI News Digest">
  <meta property="og:description" content="Daily AI news digest — top stories, research, tools, and breakthroughs curated automatically.">
  <meta property="og:url" content="https://xinyuki-sen.github.io/ai-news-bot/index.html">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" href="assets/robot_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Variables ──────────────────────────────────────────────────── */
    :root {
      --bg:          #0a0e14;
      --surface:     #12161e;
      --surface2:    #1a1f2b;
      --border:      #1e2430;
      --text:        #b0b8c8;
      --text-strong: #e2e8f0;
      --text-muted:  #636d80;
      --accent:      #6c9cff;
      --accent2:     #a78bfa;
      --radius:      16px;
      --panel-w:     360px;
    }
    [data-theme="light"] {
      --bg:          #f8f9fc;
      --surface:     #ffffff;
      --surface2:    #f0f2f5;
      --border:      #e5e7eb;
      --text:        #374151;
      --text-strong: #111827;
      --text-muted:  #9ca3af;
      --accent:      #4f7eff;
      --accent2:     #7c3aed;
    }

    /* ── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 72px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 8px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 40;
    }
    .sidebar .logo { margin-bottom: 16px; }
    .logo-img {
      width: 40px; height: 40px;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .logo-img:hover { transform: scale(1.08) rotate(-3deg); }
    .sidebar .spacer { flex: 1; }
    .sb-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      position: relative;
    }
    .sb-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sb-btn:hover, .sb-btn.active { background: var(--surface2); color: var(--accent); }
    .sb-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 10px); top: 50%;
      transform: translateY(-50%);
      background: var(--surface2); color: var(--text-strong);
      border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 8px;
      font-size: 0.7em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 100;
    }
    .sb-btn[data-tooltip]:hover::after { opacity: 1; }
    .sb-badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }

    /* ── Main ───────────────────────────────────────────────────────── */
    .main { flex: 1; padding: 36px 40px; min-width: 0; }
    h1 {
      font-size: 1.6em; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .date { color: var(--text-muted); font-size: 0.8em; margin-bottom: 24px; font-weight: 400; }

    /* ── Search ─────────────────────────────────────────────────────── */
    .topbar { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .search {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px 10px 40px;
      color: var(--text); font-size: 0.85em; font-family: inherit;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,156,255,0.1); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .search::placeholder { color: var(--text-muted); }

    /* ── Tabs ───────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab {
      padding: 5px 14px; border-radius: 20px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); font-size: 0.75em; font-weight: 500;
      cursor: pointer; transition: all 0.2s; user-select: none; font-family: inherit;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .tab-count { display: inline-block; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 0 6px; font-size: 0.85em; margin-left: 4px; }
    .tab.active .tab-count { background: rgba(255,255,255,0.25); }

    /* ── Top Picks ──────────────────────────────────────────────────── */
    .top-picks { margin-bottom: 28px; }
    .top-picks h2 { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; font-weight: 600; }
    .top-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 8px;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .top-card:hover { background: var(--surface2); transform: translateY(-1px); }
    .top-card .rank { color: var(--accent); font-weight: 700; font-size: 0.75em; min-width: 22px; padding-top: 2px; }
    .top-card .tc-title { color: var(--text-strong); font-weight: 600; font-size: 0.85em; line-height: 1.4; }
    .top-card .tc-meta { color: var(--text-muted); font-size: 0.72em; margin-top: 3px; }

    /* ── Grid ───────────────────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

    /* ── Card (borderless, minimal) ─────────────────────────────────── */
    .card {
      background: var(--surface);
      border: none;
      border-radius: var(--radius);
      padding: 22px 20px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 120px; position: relative;
      opacity: 0; transform: translateY(12px);
      animation: fadeUp 0.4s forwards;
    }
    .card:hover {
      background: var(--surface2);
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      transform: translateY(-3px);
    }
    .card.selected { box-shadow: 0 0 0 2px var(--accent2), 0 4px 20px rgba(167,139,250,0.12); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .card-bookmark {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); opacity: 0; transition: all 0.15s; padding: 2px;
    }
    .card-bookmark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .card:hover .card-bookmark, .card-bookmark.bookmarked { opacity: 1; }
    .card-bookmark.bookmarked { color: var(--accent); }
    .card-bookmark.bookmarked svg { fill: var(--accent); }

    .card-title {
      color: var(--text-strong); font-weight: 600; font-size: 0.88em;
      line-height: 1.5; padding-right: 20px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 6px; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted);
      font-size: 0.68em; font-weight: 500; flex-shrink: 0;
    }
    .card-time { color: var(--text-muted); font-size: 0.68em; }

    /* ── Skeleton ───────────────────────────────────────────────────── */
    .skeleton-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 22px 20px; min-height: 120px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .skel {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Error / Empty ─────────────────────────────────────────────── */
    .error-state { text-align: center; padding: 60px 20px; display: none; }
    .error-state.show { display: block; }
    .error-state .err-icon { font-size: 2em; margin-bottom: 12px; opacity: 0.5; }
    .error-state p { color: var(--text-muted); margin-bottom: 16px; font-size: 0.9em; }
    .btn-retry {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 8px 22px; font-weight: 600; cursor: pointer; font-size: 0.85em; font-family: inherit;
    }
    .empty-state { grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0; display: none; font-size: 0.9em; }
    .empty-state.show { display: block; }

    /* ── Antigravity-Style Resizable Panel ───────────────────────────── */
    .panel-backdrop {
      display: none;
    }
    .panel {
      width: var(--panel-w);
      min-width: 280px;
      max-width: 650px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      position: relative;
    }
    .panel-resizer {
      position: absolute;
      left: -3px;
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 50;
      transition: background 0.15s;
    }
    .panel-resizer:hover, .panel-resizer.dragging {
      background: var(--accent);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .panel-header-title {
      font-size: 0.75em;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-tool-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .panel-tool-btn:hover {
      background: var(--surface2);
      color: var(--text-strong);
    }
    .panel-tool-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
    }
    .panel-empty {
      color: var(--text-muted);
      font-size: 0.85em;
      text-align: center;
      margin-top: 40px;
    }
    .panel-empty .panel-hint { font-size: 1.8em; margin-bottom: 10px; opacity: 0.3; }
    .panel h3 { color: var(--text-strong); font-size: 1.05em; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
    .panel .panel-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .panel .panel-src, .panel .panel-time { color: var(--text-muted); font-size: 0.75em; }
    .panel .panel-cat { padding: 2px 10px; border-radius: 20px; background: var(--surface2); color: var(--text-muted); font-size: 0.7em; font-weight: 500; }
    .panel-summary { color: var(--text); font-size: 0.85em; line-height: 1.75; margin-bottom: 20px; border-left: 2px solid var(--accent); padding-left: 14px; font-weight: 400; }
    .panel a.open-btn {
      display: block; text-align: center; background: var(--accent); color: #fff;
      padding: 10px; border-radius: 10px; text-decoration: none;
      font-weight: 600; font-size: 0.85em; transition: opacity 0.15s; margin-bottom: 8px;
    }
    .panel a.open-btn:hover { opacity: 0.85; }
    .panel .bm-btn {
      display: block; width: 100%; text-align: center;
      background: var(--surface2); color: var(--text-muted);
      padding: 8px; border-radius: 10px; border: none;
      font-size: 0.8em; font-weight: 500; cursor: pointer; transition: color 0.15s; font-family: inherit;
    }
    .panel .bm-btn:hover { color: var(--accent); }
    .panel .bm-btn.bookmarked { color: var(--accent); }

    /* ── Bookmarks Overlay ─────────────────────────────────────────── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 100; backdrop-filter: blur(6px); }
    .overlay.show { display: flex; align-items: center; justify-content: center; }
    .overlay-box {
      background: var(--surface); border-radius: var(--radius); padding: 28px;
      width: 480px; max-width: 95vw; max-height: 80vh; overflow-y: auto;
    }
    .overlay-box h2 { color: var(--text-strong); font-size: 1em; font-weight: 600; margin-bottom: 16px; }
    .bm-item { padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .bm-item:last-child { border-bottom: none; }
    .bm-item:hover .bm-item-title { color: var(--accent); }
    .bm-item-title { color: var(--text-strong); font-size: 0.85em; font-weight: 600; margin-bottom: 3px; }
    .bm-item-meta { color: var(--text-muted); font-size: 0.72em; }
    .bm-empty { color: var(--text-muted); font-size: 0.85em; text-align: center; padding: 30px 0; }
    .overlay-close { float: right; background: none; border: none; color: var(--text-muted); font-size: 1.1em; cursor: pointer; }

    /* ── Mobile & Android Compatibility ─────────────────────────────── */
    .mobile-handle { display: none; }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        padding-bottom: 64px; /* Space for bottom navigation */
      }
      .sidebar {
        width: 100%;
        height: 60px;
        position: fixed;
        bottom: 0;
        top: auto;
        left: 0;
        right: 0;
        flex-direction: row;
        justify-content: space-around;
        padding: 0 16px;
        border-top: 1px solid var(--border);
        border-right: none;
        background: rgba(18, 22, 30, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 90;
      }
      [data-theme="light"] .sidebar {
        background: rgba(255, 255, 255, 0.96);
      }
      .sidebar .logo, .sidebar .spacer { display: none; }
      .sb-btn { width: 44px; height: 44px; }
      .sb-btn[data-tooltip]::after { display: none; }

      .main {
        padding: 24px 16px 32px 16px;
        max-width: 100%;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      /* Mobile Detail Bottom Sheet */
      .panel-resizer { display: none; }
      .panel-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 95;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .panel-backdrop.active {
        opacity: 1;
        pointer-events: auto;
      }
      .panel {
        position: fixed;
        bottom: 0;
        top: auto;
        left: 0;
        right: 0;
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        height: 80vh;
        max-height: 85vh;
        border-radius: 24px 24px 0 0;
        border-top: 1px solid var(--border);
        border-left: none;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        z-index: 100;
        transform: translateY(105%);
        transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .panel.active {
        transform: translateY(0);
      }
      .mobile-handle {
        display: block;
        width: 38px;
        height: 4px;
        background: var(--text-muted);
        opacity: 0.35;
        border-radius: 4px;
        margin: 10px auto 0;
      }
    }
  </style>
</head>
<body>

  <!-- ── Sidebar / Mobile Bottom Nav ──────────────────────────────── -->
  <nav class="sidebar">
    <div class="logo"><img src="assets/sidebar_logo.png" alt="Logo" class="logo-img"></div>
    <a href="index.html" class="sb-btn active" data-tooltip="News"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
    <a href="tools.html" class="sb-btn" data-tooltip="Tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></a>
    <a href="prompts.html" class="sb-btn" data-tooltip="Prompts"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
    <button class="sb-btn" id="btnBookmarks" data-tooltip="Bookmarks"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="sb-badge" id="bmBadge" style="display:none;"></span></button>
    <div class="spacer"></div>
    <button class="sb-btn" id="btnTheme" data-tooltip="Theme"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </nav>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <main class="main">
    <h1>AI News Digest</h1>
    <div class="date" id="dateBar">Loading…</div>

    <section class="top-picks" id="topPicksSection" style="display:none;">
      <h2>Top Picks</h2>
      <div id="topPicks"></div>
    </section>

    <div class="topbar">
      <div class="search-wrap">
        <label for="search">Search articles</label>
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input class="search" id="search" type="search" placeholder="Search articles…" autocomplete="off">
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="grid" id="grid" role="list"></div>

    <div class="error-state" id="errorState" role="alert">
      <div class="err-icon">⚠</div>
      <p>Could not load news. Check your connection.</p>
      <button class="btn-retry" id="btnRetry">Retry</button>
    </div>
  </main>

  <!-- ── Mobile Backdrop ─────────────────────────────────────────── -->
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <!-- ── Resizable Antigravity-Style Panel ────────────────────────── -->
  <aside class="panel" id="panel">
    <div class="panel-resizer" id="panelResizer" title="Drag to resize panel"></div>
    <div class="mobile-handle"></div>
    <div class="panel-header">
      <div class="panel-header-title">
        <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        <span>Preview</span>
      </div>
      <div class="panel-header-actions">
        <button class="panel-tool-btn" id="panelCloseBtn" title="Close panel">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="panel-empty">
        <div class="panel-hint">←</div>
        Click an article to preview details here.
      </div>
    </div>
  </aside>

  <!-- ── Bookmarks Overlay ────────────────────────────────────────── -->
  <div class="overlay" id="bmOverlay">
    <div class="overlay-box">
      <button class="overlay-close" id="bmClose">✕</button>
      <h2>Bookmarks</h2>
      <div id="bmList"></div>
    </div>
  </div>

<script>
/* ── State ────────────────────────────────────────────────────────── */
let allArticles = [];
let activeCategory = 'All';
let selectedId = null;
let bookmarks = JSON.parse(localStorage.getItem('aind_bookmarks') || '[]');

/* ── Panel Width Persistence & Resize Logic ───────────────────────── */
const panel = document.getElementById('panel');
const resizer = document.getElementById('panelResizer');
const backdrop = document.getElementById('panelBackdrop');
const panelCloseBtn = document.getElementById('panelCloseBtn');

const savedPanelWidth = localStorage.getItem('aind_panel_width');
if (savedPanelWidth && window.innerWidth > 768) {
  panel.style.width = savedPanelWidth + 'px';
}

let isResizing = false;
if (resizer) {
  resizer.addEventListener('mousedown', e => {
    isResizing = true;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!isResizing) return;
    const newWidth = window.innerWidth - e.clientX;
    if (newWidth >= 280 && newWidth <= 650) {
      panel.style.width = newWidth + 'px';
      localStorage.setItem('aind_panel_width', newWidth);
    }
  });
  document.addEventListener('mouseup', () => {
    if (isResizing) {
      isResizing = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
}

function closePanel() {
  panel.classList.remove('active');
  backdrop.classList.remove('active');
  selectedId = null;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
}

panelCloseBtn.addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);

/* ── Theme ────────────────────────────────────────────────────────── */
const saved = localStorage.getItem('aind_theme') || 'dark';
document.documentElement.setAttribute('data-theme', saved);
const btnTheme = document.getElementById('btnTheme');
const themeIcon = document.getElementById('themeIcon');
function setThemeIcon(t) {
  themeIcon.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
}
setThemeIcon(saved);
btnTheme.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('aind_theme', next);
  setThemeIcon(next);
});

/* ── Helpers ──────────────────────────────────────────────────────── */
function timeAgo(iso) {
  const m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  return `${Math.floor(h / 24)}d`;
}
function formatDate(iso) {
  return new Date(iso).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
}
function isBookmarked(id) { return bookmarks.includes(id); }
function toggleBookmark(id) {
  bookmarks = isBookmarked(id) ? bookmarks.filter(b => b !== id) : [...bookmarks, id];
  localStorage.setItem('aind_bookmarks', JSON.stringify(bookmarks));
  refreshBookmarkUI();
}
function refreshBookmarkUI() {
  document.getElementById('bmBadge').style.display = bookmarks.length ? '' : 'none';
  document.querySelectorAll('[data-bm-id]').forEach(btn => {
    const id = +btn.dataset.bmId;
    const bm = isBookmarked(id);
    btn.classList.toggle('bookmarked', bm);
    btn.querySelector('svg').style.fill = bm ? 'var(--accent)' : 'none';
  });
  const p = document.getElementById('panelBmBtn');
  if (p && selectedId !== null) {
    p.textContent = isBookmarked(selectedId) ? '★ Bookmarked' : '☆ Bookmark';
    p.classList.toggle('bookmarked', isBookmarked(selectedId));
  }
}

/* ── Skeleton ─────────────────────────────────────────────────────── */
function renderSkeletons(n = 9) {
  document.getElementById('grid').innerHTML = Array.from({ length: n }, () => `
    <div class="skeleton-card">
      <div class="skel" style="height:13px;width:90%"></div>
      <div class="skel" style="height:13px;width:70%"></div>
      <div style="flex:1"></div>
      <div class="skel" style="height:20px;width:60px;border-radius:20px"></div>
    </div>
  `).join('');
}

/* ── Render Grid ──────────────────────────────────────────────────── */
function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return allArticles.filter(a => {
    const matchCat = activeCategory === 'All' || a.category === activeCategory;
    const matchQ = !q || a.title.toLowerCase().includes(q) || a.source.toLowerCase().includes(q) || a.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const articles = getFiltered();
  if (!articles.length) {
    grid.innerHTML = '<div class="empty-state show">No articles found.</div>';
    return;
  }
  grid.innerHTML = articles.map((a, i) => `
    <article class="card${selectedId === a.id ? ' selected' : ''}" data-id="${a.id}" tabindex="0" style="animation-delay:${i * 0.03}s">
      <button class="card-bookmark${isBookmarked(a.id) ? ' bookmarked' : ''}" data-bm-id="${a.id}">
        <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <div class="card-title">${a.title}</div>
      <div class="card-footer">
        <span class="badge">${a.category}</span>
        <span class="card-time">${timeAgo(a.published_at)}</span>
      </div>
    </article>
  `).join('');

  grid.querySelectorAll('.card').forEach(card => {
    const id = +card.dataset.id;
    card.addEventListener('click', e => {
      if (e.target.closest('.card-bookmark')) return;
      selectedId = id;
      openPanel(id);
      grid.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', +c.dataset.id === id));
    });
    card.addEventListener('keydown', e => { if (e.key === 'Enter') card.click(); });
  });
  grid.querySelectorAll('.card-bookmark').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); toggleBookmark(+btn.dataset.bmId); });
  });
}

/* ── Tabs ─────────────────────────────────────────────────────────── */
function renderTabs() {
  const counts = {};
  allArticles.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort()];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = cats.map(cat => {
    const count = cat === 'All' ? allArticles.length : counts[cat];
    return `<button class="tab${activeCategory === cat ? ' active' : ''}" data-cat="${cat}">${cat}<span class="tab-count">${count}</span></button>`;
  }).join('');
  tabs.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { activeCategory = tab.dataset.cat; renderTabs(); renderGrid(); });
  });
}

/* ── Top Picks ────────────────────────────────────────────────────── */
function renderTopPicks(ids) {
  const picks = ids.map(id => allArticles.find(a => a.id === id)).filter(Boolean);
  if (!picks.length) return;
  document.getElementById('topPicksSection').style.display = '';
  document.getElementById('topPicks').innerHTML = picks.map((a, i) => `
    <div class="top-card" data-id="${a.id}" tabindex="0">
      <span class="rank">#${i+1}</span>
      <div>
        <div class="tc-title">${a.title}</div>
        <div class="tc-meta">${a.source} · ${timeAgo(a.published_at)}</div>
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.top-card').forEach(c => {
    c.addEventListener('click', () => { selectedId = +c.dataset.id; openPanel(selectedId); });
  });
}

/* ── Panel ────────────────────────────────────────────────────────── */
function openPanel(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  document.getElementById('panelBody').innerHTML = `
    <h3>${a.title}</h3>
    <div class="panel-meta">
      <span class="panel-cat">${a.category}</span>
      <span class="panel-src">${a.source}</span>
      <span class="panel-time">${timeAgo(a.published_at)}</span>
    </div>
    <p class="panel-summary">${a.summary || 'No summary available.'}</p>
    <a class="open-btn" href="${a.url}" target="_blank" rel="noopener">Open Article ↗</a>
    <button class="bm-btn${isBookmarked(id) ? ' bookmarked' : ''}" id="panelBmBtn">
      ${isBookmarked(id) ? '★ Bookmarked' : '☆ Bookmark'}
    </button>
    <p style="color:var(--text-muted);font-size:0.7em;margin-top:14px">Published: ${formatDate(a.published_at)}</p>
  `;
  panel.classList.add('active');
  backdrop.classList.add('active');
  document.getElementById('panelBmBtn').addEventListener('click', () => toggleBookmark(id));
}

/* ── Bookmarks Overlay ────────────────────────────────────────────── */
document.getElementById('btnBookmarks').addEventListener('click', () => {
  const overlay = document.getElementById('bmOverlay');
  const list = document.getElementById('bmList');
  if (!bookmarks.length) {
    list.innerHTML = '<div class="bm-empty">No bookmarks yet.</div>';
  } else {
    const saved = bookmarks.map(id => allArticles.find(a => a.id === id)).filter(Boolean);
    list.innerHTML = saved.map(a => `
      <div class="bm-item" data-id="${a.id}" tabindex="0">
        <div class="bm-item-title">${a.title}</div>
        <div class="bm-item-meta">${a.source} · ${a.category}</div>
      </div>
    `).join('');
    list.querySelectorAll('.bm-item').forEach(item => {
      item.addEventListener('click', () => {
        overlay.classList.remove('show');
        selectedId = +item.dataset.id; openPanel(selectedId);
        document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', +c.dataset.id === selectedId));
      });
    });
  }
  overlay.classList.add('show');
});
document.getElementById('bmClose').addEventListener('click', () => document.getElementById('bmOverlay').classList.remove('show'));
document.getElementById('bmOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); });

/* ── Search ──────────────────────────────────────────────────────── */
let st; document.getElementById('search').addEventListener('input', () => { clearTimeout(st); st = setTimeout(renderGrid, 200); });

/* ── Load ─────────────────────────────────────────────────────────── */
async function loadNews() {
  renderSkeletons();
  document.getElementById('errorState').classList.remove('show');
  try {
    const res = await fetch('news.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allArticles = data.articles || [];
    const d = new Date(data.last_updated);
    document.getElementById('dateBar').textContent = `Updated ${d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })} · Hourly`;
    renderTopPicks(data.top_pick_ids || []);
    renderTabs();
    renderGrid();
    refreshBookmarkUI();
  } catch (err) {
    console.error(err);
    document.getElementById('grid').innerHTML = '';
    document.getElementById('errorState').classList.add('show');
  }
}
document.getElementById('btnRetry').addEventListener('click', loadNews);
loadNews();
</script>
