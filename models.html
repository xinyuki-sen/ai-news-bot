<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chrono — AI Models Leaderboard</title>
  <meta name="description" content="Frontier AI models comparison leaderboard — Arena Elo, SWE-bench coding scores, context windows, and API pricing.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chrono — AI Models Leaderboard">
  <meta property="og:description" content="Compare frontier AI foundation models on coding benchmarks, reasoning, context size, and token pricing.">
  <meta property="og:url" content="https://xinyuki-sen.github.io/ai-news-bot/models.html">
  <meta name="theme-color" content="#0a0e14">
  <link rel="icon" href="assets/robot_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ──────────────────────────────────────────────────── */
    :root {
      --bg:          #0a0e14;
      --surface:     #12161e;
      --surface2:    #1a1f2b;
      --surface3:    #222938;
      --border:      #1e2430;
      --text:        #b0b8c8;
      --text-strong: #e2e8f0;
      --text-muted:  #636d80;
      --accent:      #6c9cff;
      --accent2:     #a78bfa;
      --success:     #34d399;
      --warning:     #fbbf24;
      --radius:      16px;
      --panel-w:     380px;
    }
    [data-theme="light"] {
      --bg:          #f8f9fc;
      --surface:     #ffffff;
      --surface2:    #f0f2f5;
      --surface3:    #e5e7eb;
      --border:      #e5e7eb;
      --text:        #374151;
      --text-strong: #111827;
      --text-muted:  #9ca3af;
      --accent:      #4f7eff;
      --accent2:     #7c3aed;
      --success:     #10b981;
      --warning:     #d97706;
    }

    /* ── Reset & Baseline ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 72px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 8px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 40;
      contain: layout paint;
    }
    .sidebar .logo { margin-bottom: 16px; }
    .logo-img {
      width: 40px; height: 40px;
      border-radius: 12px;
      object-fit: cover;
      transform: translateZ(0);
      transition: transform .2s cubic-bezier(0.2,0.8,0.2,1);
    }
    .logo-img:hover { transform: scale(1.08) rotate(-3deg); }
    .sidebar .spacer { flex: 1; }
    .sb-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background-color .15s ease, color .15s ease;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .sb-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sb-btn:hover, .sb-btn.active { background: var(--surface2); color: var(--accent); }
    .sb-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 10px); top: 50%;
      transform: translateY(-50%);
      background: var(--surface2); color: var(--text-strong);
      border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 8px;
      font-size: .7em; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .12s ease; z-index: 100;
    }
    .sb-btn[data-tooltip]:hover::after { opacity: 1; }
    .sb-badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }

    /* ── Main ───────────────────────────────────────────────────────── */
    .main { flex: 1; padding: 36px 40px; min-width: 0; }
    h1 {
      font-size: 1.6em; font-weight: 700; letter-spacing: -.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 4px;
    }
    .date { color: var(--text-muted); font-size: .8em; margin-bottom: 24px; font-weight: 400; }

    /* ── Topbar ─────────────────────────────────────────────────────── */
    .topbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-wrap label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .search {
      width: 100%; background: var(--surface);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 80px 10px 40px;
      color: var(--text); font-size: .85em; font-family: inherit;
      outline: none; transition: border-color .15s ease, box-shadow .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,156,255,.12); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .search-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .search-shortcut {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: .7em; background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); padding: 2px 6px; border-radius: 6px; pointer-events: none;
    }
    .sort-wrap { display: flex; align-items: center; gap: 8px; }
    .sort-select {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; border-radius: 12px;
      font-size: .8em; font-family: inherit; outline: none; cursor: pointer;
    }
    .sort-select:focus { border-color: var(--accent); }

    /* ── Tabs ───────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab {
      padding: 5px 14px; border-radius: 20px; background: transparent;
      border: 1px solid var(--border); color: var(--text-muted);
      font-size: .75em; font-weight: 500; cursor: pointer;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
      user-select: none; font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .tab-count { display: inline-block; background: rgba(255,255,255,.15); border-radius: 10px; padding: 0 6px; font-size: .85em; margin-left: 4px; }
    .tab.active .tab-count { background: rgba(255,255,255,.25); }

    /* ── Leaderboard Grid ───────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface); border: none; border-radius: var(--radius);
      padding: 20px; cursor: pointer; display: flex; flex-direction: column;
      justify-content: space-between; position: relative;
      transform: translate3d(0,0,0); will-change: transform, box-shadow;
      transition: transform .18s cubic-bezier(0.2,0.8,0.2,1), background-color .15s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent; contain: content;
    }
    .card:hover { background: var(--surface2); box-shadow: 0 8px 24px rgba(0,0,0,.2); transform: translateY(-2px); }
    .card.selected { box-shadow: 0 0 0 2px var(--accent2), 0 4px 20px rgba(167,139,250,.15); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-provider { font-size: .7em; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .card-badge {
      font-size: .65em; font-weight: 600; padding: 2px 8px; border-radius: 12px;
      background: var(--surface2); color: var(--accent); border: 1px solid rgba(108,156,255,0.2);
    }
    .card-badge.open-weight { background: rgba(52, 211, 153, 0.12); color: var(--success); border-color: rgba(52, 211, 153, 0.3); }

    .card-title { font-size: 1.05em; font-weight: 700; color: var(--text-strong); line-height: 1.35; margin-bottom: 14px; }
    
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-box { background: var(--surface2); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); }
    .stat-box .lbl { font-size: .65em; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
    .stat-box .val { font-size: .85em; font-weight: 700; color: var(--text-strong); }
    .stat-box .val.accent { color: var(--accent); }
    .stat-box .val.success { color: var(--success); }

    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); font-size: .75em; color: var(--text-muted); }
    .card-footer .pricing-tag { font-weight: 600; color: var(--text-strong); }

    .card-bookmark {
      position: absolute; top: 14px; right: 14px; background: none;
      border: none; cursor: pointer; color: var(--text-muted); opacity: 0;
      transition: opacity .12s ease, color .12s ease; padding: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .card-bookmark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; pointer-events: none; }
    .card:hover .card-bookmark, .card-bookmark.bookmarked { opacity: 1; }
    .card-bookmark.bookmarked { color: var(--accent); }

    /* ── Antigravity Resizable Panel ────────────────────────────────── */
    .panel {
      width: var(--panel-w); min-width: 280px; max-width: 650px;
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; position: relative;
      min-height: 100vh; flex-shrink: 0; z-index: 30;
      contain: layout paint;
    }
    .panel-resizer {
      position: absolute; left: -4px; top: 0; bottom: 0; width: 8px;
      cursor: col-resize; z-index: 50; transition: background-color .12s ease;
    }
    .panel-resizer:hover, .panel-resizer.dragging { background: var(--accent); }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--border); gap: 10px; flex-shrink: 0;
    }
    .panel-header-title {
      font-size: .75em; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 6px;
    }
    .panel-tool-btn {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
      padding: 6px 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      transition: background-color .12s ease, color .12s ease; -webkit-tap-highlight-color: transparent;
    }
    .panel-tool-btn:hover { background: var(--surface2); color: var(--text-strong); }
    .panel-tool-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
    .panel-body {
      flex: 1; overflow-y: auto; padding: 24px 20px;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }
    .panel-empty { color: var(--text-muted); font-size: .85em; text-align: center; margin-top: 40px; }
    .panel-empty .panel-hint { font-size: 1.8em; margin-bottom: 10px; opacity: .3; }

    /* Model Detail inside Panel */
    .model-detail-header { margin-bottom: 18px; }
    .model-detail-provider { font-size: .75em; font-weight: 600; text-transform: uppercase; color: var(--accent); letter-spacing: .05em; margin-bottom: 4px; }
    .model-detail-name { font-size: 1.25em; font-weight: 700; color: var(--text-strong); line-height: 1.3; margin-bottom: 8px; }
    .model-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .model-tag { font-size: .7em; padding: 3px 8px; border-radius: 12px; background: var(--surface2); color: var(--text-muted); }

    .bench-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .bench-title { font-size: .75em; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
    .bench-bar-item { margin-bottom: 10px; }
    .bench-bar-item:last-child { margin-bottom: 0; }
    .bench-bar-label { display: flex; justify-content: space-between; font-size: .75em; margin-bottom: 4px; color: var(--text-strong); }
    .bench-bar-bg { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
    .bench-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }

    .spec-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: .8em; }
    .spec-table tr { border-bottom: 1px solid var(--border); }
    .spec-table td { padding: 8px 0; }
    .spec-table td:first-child { color: var(--text-muted); width: 45%; }
    .spec-table td:last-child { color: var(--text-strong); font-weight: 600; text-align: right; }

    /* Token Calculator */
    .calc-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
    .calc-title { font-size: .75em; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .calc-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .calc-field label { display: block; font-size: .65em; color: var(--text-muted); margin-bottom: 3px; }
    .calc-field input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; color: var(--text-strong); font-size: .8em; outline: none; }
    .calc-result { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px dashed var(--border); font-size: .8em; }
    .calc-cost { font-size: 1.1em; font-weight: 700; color: var(--success); }

    .panel-strengths { font-size: .8em; line-height: 1.6; color: var(--text); margin-bottom: 20px; border-left: 2px solid var(--accent); padding-left: 12px; }
    
    .panel a.open-btn {
      display: block; text-align: center; background: var(--accent); color: #fff;
      padding: 10px; border-radius: 10px; text-decoration: none; font-weight: 600;
      font-size: .85em; transition: opacity .15s ease; margin-bottom: 8px;
    }
    .panel a.open-btn:hover { opacity: .88; }

    .panel .bm-btn {
      display: block; width: 100%; text-align: center; background: var(--surface2);
      color: var(--text-muted); padding: 8px; border-radius: 10px; border: none;
      font-size: .8em; font-weight: 500; cursor: pointer; transition: color .15s ease;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .panel .bm-btn:hover, .panel .bm-btn.bookmarked { color: var(--accent); }

    /* ── Bookmarks & Command Palette Overlay ────────────────────────── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; z-index: 120; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 20px; }
    .overlay.active { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { color: var(--text-strong); font-size: 1em; font-weight: 600; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; }
    .modal-close svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Command Palette Specific */
    .cmd-palette-input-wrap { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
    .cmd-palette-input-wrap svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    .cmd-palette-input { flex: 1; background: transparent; border: none; color: var(--text-strong); font-size: 1em; outline: none; font-family: inherit; }
    .cmd-badge { font-size: .65em; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 2px 6px; border-radius: 6px; }
    .cmd-results { max-height: 380px; overflow-y: auto; padding: 8px; }
    .cmd-group-title { font-size: .65em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 8px 10px 4px 10px; }
    .cmd-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background-color .1s; gap: 10px; color: var(--text); text-decoration: none; }
    .cmd-item:hover, .cmd-item.selected { background: var(--surface2); color: var(--text-strong); }
    .cmd-item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cmd-item-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--surface3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cmd-item-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
    .cmd-item-text { min-width: 0; }
    .cmd-item-title { font-size: .85em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-strong); }
    .cmd-item-sub { font-size: .7em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cmd-item-tag { font-size: .65em; padding: 2px 6px; border-radius: 6px; background: var(--surface3); color: var(--text-muted); flex-shrink: 0; }

    /* ── Mobile Layout (< 768px) ────────────────────────────────────── */
    @media (max-width: 768px) {
      body { flex-direction: column; padding-bottom: 70px; }
      .sidebar {
        position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100%; height: 56px;
        flex-direction: row; justify-content: space-around; padding: 0 16px; border-top: 1px solid var(--border);
        border-right: none; background: rgba(18,22,30,.94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 90;
      }
      [data-theme="light"] .sidebar { background: rgba(255,255,255,.96); }
      .sidebar .logo, .sidebar .spacer { display: none; }
      .sb-btn { width: 44px; height: 44px; }
      .sb-btn[data-tooltip]::after { display: none; }
      .main { padding: 24px 16px 32px 16px; max-width: 100%; }
      .grid { grid-template-columns: 1fr; gap: 10px; }

      .panel-resizer { display: none; }
      .panel-backdrop {
        display: block; position: fixed; inset: 0; background: rgba(0,0,0,.65);
        backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 95;
        opacity: 0; pointer-events: none; transition: opacity .25s ease;
      }
      .panel-backdrop.active { opacity: 1; pointer-events: auto; }
      .panel {
        position: fixed; bottom: 0; top: auto; left: 0; right: 0; width: 100% !important;
        min-width: 100% !important; max-width: 100% !important; height: 82vh; max-height: 85vh;
        min-height: auto; border-radius: 24px 24px 0 0; border-top: 1px solid var(--border);
        border-left: none; box-shadow: 0 -10px 40px rgba(0,0,0,.5); z-index: 100;
        transform: translate3d(0, 105%, 0); will-change: transform;
        transition: transform .28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .panel.active { transform: translate3d(0, 0, 0); }
      .mobile-handle {
        display: block; width: 36px; height: 4px; background: var(--text-muted);
        border-radius: 2px; margin: 10px auto 0 auto; opacity: .4; cursor: pointer; flex-shrink: 0;
      }
    }
  </style>
</head>

    <a href="prompts.html" class="sb-btn" data-tooltip="Prompts"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
    <a href="models.html" class="sb-btn active" data-tooltip="Models Leaderboard"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><path d="M7 8h10"/><path d="M7 12h6"/></svg></a>
    <a href="concepts.html" class="sb-btn" data-tooltip="AI Core Concepts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="5" transform="rotate(-25 12 12)"/></svg></a>
    <button class="sb-btn" id="btnCmdPalette" data-tooltip="Command Palette (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="sb-btn" id="btnBookmarks" data-tooltip="Bookmarks"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="sb-badge" id="bmBadge" style="display:none;"></span></button>
    <div class="spacer"></div>
    <button class="sb-btn" id="btnTheme" data-tooltip="Theme"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
  </nav>

  <!-- ── Main ───────────────────────────────────────────────────────── -->
  <main class="main">
    <h1>AI Models Leaderboard</h1>
    <div class="date" id="dateBar">LMSYS Arena Elo · SWE-bench Coding · Context Windows · Token Pricing</div>

    <div class="topbar">
      <div class="search-wrap">
        <label for="search">Search models</label>
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input class="search" id="search" type="search" placeholder="Search models or providers…" autocomplete="off">
        <span class="search-shortcut">⌘K</span>
      </div>
      <div class="sort-wrap">
        <select class="sort-select" id="sortSelect">
          <option value="elo">Sort by Arena Elo (Highest)</option>
          <option value="swe">Sort by SWE-bench (Coding)</option>
          <option value="math">Sort by Math / Reasoning</option>
          <option value="price_low">Sort by Input Price (Lowest)</option>
          <option value="price_high">Sort by Input Price (Highest)</option>
        </select>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="grid" id="grid" role="list"></div>
  </main>

  <!-- ── Mobile Backdrop ───────────────────────────────────────────── -->
  <div class="panel-backdrop" id="panelBackdrop"></div>

  <!-- ── Resizable Antigravity Detail Panel ──────────────────────────── -->
  <aside class="panel" id="panel">
    <div class="panel-resizer" id="panelResizer" title="Drag to resize"></div>
    <div class="mobile-handle"></div>
    <div class="panel-header">
      <div class="panel-header-title">
        <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        <span>Model Details</span>
      </div>
      <div class="panel-header-actions">
        <button class="panel-tool-btn" id="panelCloseBtn" title="Close panel">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-body" id="panelBody">
      <div class="panel-empty">
        <div class="panel-hint">📊</div>
        <p>Select a model to view full benchmarks, context limits, and token pricing calculator.</p>
      </div>
    </div>
  </aside>

  <!-- ── Universal Command Palette Modal ────────────────────────────── -->
  <div class="overlay" id="cmdOverlay" role="dialog" aria-modal="true">
    <div class="modal" style="max-width: 580px;">
      <div class="cmd-palette-input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="cmd-palette-input" id="cmdInput" placeholder="Type a command or search news, tools, prompts, models…" autocomplete="off">
        <span class="cmd-badge">ESC</span>
      </div>
      <div class="cmd-results" id="cmdResults"></div>
    </div>
  </div>

  <!-- ── Bookmarks Overlay ─────────────────────────────────────────── -->
  <div class="overlay" id="bmOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <h3>Saved Bookmarks</h3>
        <button class="modal-close" id="bmClose"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="bmList"></div>
    </div>
  </div>

  <script>
    /* ── State ─────────────────────────────────────────────────────── */
    let allModels = [];
    let activeCat = 'All';
    let searchQuery = '';
    let sortMode = 'elo';
    let selectedModel = null;
    let bookmarks = JSON.parse(localStorage.getItem('ainews_bm_models') || '[]');

    /* ── DOM References ────────────────────────────────────────────── */
    const grid = document.getElementById('grid');
    const tabsContainer = document.getElementById('tabs');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sortSelect');
    const panel = document.getElementById('panel');
    const panelBody = document.getElementById('panelBody');
    const panelCloseBtn = document.getElementById('panelCloseBtn');
    const panelBackdrop = document.getElementById('panelBackdrop');
    const panelResizer = document.getElementById('panelResizer');
    const btnBookmarks = document.getElementById('btnBookmarks');
    const bmBadge = document.getElementById('bmBadge');
    const bmOverlay = document.getElementById('bmOverlay');
    const bmClose = document.getElementById('bmClose');
    const bmList = document.getElementById('bmList');
    const btnTheme = document.getElementById('btnTheme');
    const themeIcon = document.getElementById('themeIcon');
    const btnCmdPalette = document.getElementById('btnCmdPalette');
    const cmdOverlay = document.getElementById('cmdOverlay');
    const cmdInput = document.getElementById('cmdInput');
    const cmdResults = document.getElementById('cmdResults');

    /* ── Theme ─────────────────────────────────────────────────────── */
    function initTheme() {
      const saved = localStorage.getItem('ainews_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcon(saved);
    }
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ainews_theme', next);
      updateThemeIcon(next);
    }
    function updateThemeIcon(theme) {
      if (theme === 'light') {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
      } else {
        themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      }
    }
    btnTheme.addEventListener('click', toggleTheme);
    initTheme();

    /* ── Fetch Data ────────────────────────────────────────────────── */
    async function loadData() {
      try {
        const res = await fetch('models.json');
        if (!res.ok) throw new Error('Fetch failed');
        allModels = await res.json();
      } catch (e) {
        console.warn('Falling back to local models structure', e);
      }
      renderTabs();
      renderGrid();
      updateBmBadge();
    }

    /* ── Sorting & Filtering ───────────────────────────────────────── */
    function getFilteredModels() {
      return allModels.filter(m => {
        const matchCat = activeCat === 'All' || m.category === activeCat || (activeCat === 'Open Weights' && m.is_open);
        const query = searchQuery.toLowerCase();
        const matchSearch = !query || 
          m.name.toLowerCase().includes(query) || 
          m.provider.toLowerCase().includes(query) || 
          m.strengths.toLowerCase().includes(query);
        return matchCat && matchSearch;
      }).sort((a, b) => {
        if (sortMode === 'elo') return b.arena_elo - a.arena_elo;
        if (sortMode === 'swe') return b.swe_bench - a.swe_bench;
        if (sortMode === 'math') return b.math_score - a.math_score;
        if (sortMode === 'price_low') return a.price_input - b.price_input;
        if (sortMode === 'price_high') return b.price_input - a.price_input;
        return 0;
      });
    }

    /* ── Tabs ──────────────────────────────────────────────────────── */
    function renderTabs() {
      const cats = ['All', 'Reasoning', 'Coding', 'Open Weights', 'Vision / Multimodal', 'Fast & Lightweight'];
      tabsContainer.innerHTML = cats.map(cat => {
        let count = 0;
        if (cat === 'All') count = allModels.length;
        else if (cat === 'Open Weights') count = allModels.filter(m => m.is_open).length;
        else count = allModels.filter(m => m.category === cat).length;
        const activeClass = cat === activeCat ? 'active' : '';
        return `<button class="tab ${activeClass}" data-cat="${cat}">${cat} <span class="tab-count">${count}</span></button>`;
      }).join('');
    }

    tabsContainer.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      activeCat = tab.dataset.cat;
      renderTabs();
      renderGrid();
    });

    /* ── Grid Rendering ────────────────────────────────────────────── */
    function renderGrid() {
      const models = getFilteredModels();
      if (!models.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">No models matching your criteria.</div>';
        return;
      }

      grid.innerHTML = models.map(m => {
        const isBm = bookmarks.some(b => b.id === m.id);
        const isSel = selectedModel && selectedModel.id === m.id;
        const badgeClass = m.is_open ? 'card-badge open-weight' : 'card-badge';
        const badgeLabel = m.is_open ? 'Open Weights' : m.category;
        
        return `
          <div class="card ${isSel ? 'selected' : ''}" data-id="${m.id}" role="listitem">
            <button class="card-bookmark ${isBm ? 'bookmarked' : ''}" data-id="${m.id}" title="${isBm ? 'Remove Bookmark' : 'Bookmark'}">
              <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <div class="card-top">
              <span class="card-provider">${m.provider}</span>
              <span class="${badgeClass}">${badgeLabel}</span>
            </div>
            <div class="card-title">${m.name}</div>
            
            <div class="stats-row">
              <div class="stat-box">
                <div class="lbl">Arena Elo</div>
                <div class="val accent">${m.arena_elo}</div>
              </div>
              <div class="stat-box">
                <div class="lbl">SWE-bench</div>
                <div class="val success">${m.swe_bench}%</div>
              </div>
            </div>

            <div class="card-footer">
              <span>Context: <strong>${m.context_window}</strong></span>
              <span class="pricing-tag">$${m.price_input} / $${m.price_output}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    /* ── Detail Panel ──────────────────────────────────────────────── */
    function selectModel(m) {
      selectedModel = m;
      const isBm = bookmarks.some(b => b.id === m.id);

      panelBody.innerHTML = `
        <div class="model-detail-header">
          <div class="model-detail-provider">${m.provider}</div>
          <div class="model-detail-name">${m.name}</div>
          <div class="model-tags">
            <span class="model-tag">${m.category}</span>
            <span class="model-tag">${m.license_type}</span>
            <span class="model-tag">${m.multimodal ? 'Multimodal' : 'Text-Only'}</span>
            <span class="model-tag">Rel: ${m.release_date}</span>
          </div>
        </div>

        <div class="bench-card">
          <div class="bench-title">Key Benchmark Scores</div>
          
          <div class="bench-bar-item">
            <div class="bench-bar-label">
              <span>LMSYS Chatbot Arena Elo</span>
              <strong>${m.arena_elo}</strong>
            </div>
            <div class="bench-bar-bg"><div class="bench-bar-fill" style="width: ${((m.arena_elo - 1200) / 220) * 100}%"></div></div>
          </div>

          <div class="bench-bar-item">
            <div class="bench-bar-label">
              <span>SWE-bench Verified (Coding)</span>
              <strong>${m.swe_bench}%</strong>
            </div>
            <div class="bench-bar-bg"><div class="bench-bar-fill" style="width: ${m.swe_bench}%"></div></div>
          </div>

          <div class="bench-bar-item">
            <div class="bench-bar-label">
              <span>MATH / Reasoning Score</span>
              <strong>${m.math_score}%</strong>
            </div>
            <div class="bench-bar-bg"><div class="bench-bar-fill" style="width: ${m.math_score}%"></div></div>
          </div>
        </div>

        <table class="spec-table">
          <tr><td>Context Window</td><td>${m.context_window}</td></tr>
          <tr><td>Input Price</td><td>$${m.price_input} / 1M tokens</td></tr>
          <tr><td>Output Price</td><td>$${m.price_output} / 1M tokens</td></tr>
          <tr><td>License / Weights</td><td>${m.is_open ? 'Open Weights' : 'API Only'}</td></tr>
        </table>

        <!-- Token Calculator -->
        <div class="calc-box">
          <div class="calc-title">
            <svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg>
            <span>Token Cost Estimator</span>
          </div>
          <div class="calc-inputs">
            <div class="calc-field">
              <label>Input (Tokens)</label>
              <input type="number" id="calcInputTok" value="100000" step="10000">
            </div>
            <div class="calc-field">
              <label>Output (Tokens)</label>
              <input type="number" id="calcOutputTok" value="20000" step="5000">
            </div>
          </div>
          <div class="calc-result">
            <span>Estimated Cost:</span>
            <span class="calc-cost" id="calcCostVal">$0.00</span>
          </div>
        </div>

        <div class="panel-strengths">${m.strengths}</div>

        <a href="${m.link}" target="_blank" rel="noopener noreferrer" class="open-btn">Launch API / Docs ↗</a>
        <button class="bm-btn ${isBm ? 'bookmarked' : ''}" id="panelBmBtn">
          ${isBm ? '★ In Bookmarks' : '☆ Save to Bookmarks'}
        </button>
      `;

      // Recalculate cost
      updateCostEstimate(m);
      document.getElementById('calcInputTok').addEventListener('input', () => updateCostEstimate(m));
      document.getElementById('calcOutputTok').addEventListener('input', () => updateCostEstimate(m));

      document.getElementById('panelBmBtn').addEventListener('click', () => {
        toggleBookmark(m);
        selectModel(m);
      });

      openMobilePanel();
      renderGrid();
    }

    function updateCostEstimate(m) {
      const inTok = parseFloat(document.getElementById('calcInputTok')?.value || 0);
      const outTok = parseFloat(document.getElementById('calcOutputTok')?.value || 0);
      const cost = ((inTok / 1000000) * m.price_input) + ((outTok / 1000000) * m.price_output);
      const el = document.getElementById('calcCostVal');
      if (el) el.textContent = '$' + cost.toFixed(4);
    }

    function closePanel() {
      selectedModel = null;
      panel.classList.remove('active');
      panelBackdrop.classList.remove('active');
      panelBody.innerHTML = `
        <div class="panel-empty">
          <div class="panel-hint">📊</div>
          <p>Select a model to view full benchmarks, context limits, and token pricing calculator.</p>
        </div>
      `;
      renderGrid();
    }

    function openMobilePanel() {
      if (window.innerWidth <= 768) {
        panel.classList.add('active');
        panelBackdrop.classList.add('active');
      }
    }

    panelCloseBtn.addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);
    document.querySelector('.mobile-handle')?.addEventListener('click', closePanel);

    /* ── Event Delegation for Grid ─────────────────────────────────── */
    grid.addEventListener('click', e => {
      const bmBtn = e.target.closest('.card-bookmark');
      if (bmBtn) {
        e.stopPropagation();
        const id = bmBtn.dataset.id;
        const m = allModels.find(x => x.id === id);
        if (m) toggleBookmark(m);
        return;
      }
      const card = e.target.closest('.card');
      if (card) {
        const id = card.dataset.id;
        const m = allModels.find(x => x.id === id);
        if (m) selectModel(m);
      }
    });

    /* ── Search & Sort Listeners ───────────────────────────────────── */
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      renderGrid();
    });
    sortSelect.addEventListener('change', e => {
      sortMode = e.target.value;
      renderGrid();
    });

    /* ── Bookmarks Management ──────────────────────────────────────── */
    function toggleBookmark(m) {
      const idx = bookmarks.findIndex(b => b.id === m.id);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
      } else {
        bookmarks.push(m);
      }
      localStorage.setItem('ainews_bm_models', JSON.stringify(bookmarks));
      updateBmBadge();
      renderGrid();
    }
    function updateBmBadge() {
      if (bookmarks.length > 0) {
        bmBadge.style.display = 'block';
      } else {
        bmBadge.style.display = 'none';
      }
    }

    btnBookmarks.addEventListener('click', () => {
      if (!bookmarks.length) {
        bmList.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;">No saved models yet.</p>';
      } else {
        bmList.innerHTML = bookmarks.map(m => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
            <div>
              <div style="font-weight:600;color:var(--text-strong);">${m.name}</div>
              <div style="font-size:0.75em;color:var(--text-muted);">${m.provider} · Elo ${m.arena_elo}</div>
            </div>
            <button class="panel-tool-btn" data-remove-id="${m.id}" title="Remove">✕</button>
          </div>
        `).join('');
      }
      bmOverlay.classList.add('active');
    });

    bmClose.addEventListener('click', () => bmOverlay.classList.remove('active'));
    bmOverlay.addEventListener('click', e => { if (e.target === bmOverlay) bmOverlay.classList.remove('active'); });
    bmList.addEventListener('click', e => {
      const btn = e.target.closest('[data-remove-id]');
      if (!btn) return;
      const id = btn.dataset.removeId;
      const m = allModels.find(x => x.id === id);
      if (m) toggleBookmark(m);
      btnBookmarks.click();
    });

    /* ── Panel Resizing (Desktop) ──────────────────────────────────── */
    let isResizing = false;
    let rAF = null;
    panelResizer.addEventListener('mousedown', e => {
      isResizing = true;
      panelResizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    window.addEventListener('mousemove', e => {
      if (!isResizing) return;
      if (rAF) cancelAnimationFrame(rAF);
      rAF = requestAnimationFrame(() => {
        const newW = window.innerWidth - e.clientX;
        if (newW >= 280 && newW <= 650) {
          panel.style.width = newW + 'px';
          localStorage.setItem('ainews_panel_w', newW);
        }
      });
    }, { passive: true });
    window.addEventListener('mouseup', () => {
      if (!isResizing) return;
      isResizing = false;
      panelResizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });

    const savedW = localStorage.getItem('ainews_panel_w');
    if (savedW && window.innerWidth > 768) {
      panel.style.width = savedW + 'px';
    }

    /* ── Universal Command Palette Logic ───────────────────────────── */
    let cmdData = { news: [], tools: [], prompts: [], models: [] };
    let cmdDataLoaded = false;
    let activeCmdIndex = 0;

    async function ensureCmdData() {
      if (cmdDataLoaded) return;
      try {
        const [nRes, tRes, pRes, mRes] = await Promise.all([
          fetch('news.json').catch(() => null),
          fetch('tools.json').catch(() => null),
          fetch('prompts.json').catch(() => null),
          fetch('models.json').catch(() => null)
        ]);
        if (nRes && nRes.ok) { const d = await nRes.json(); cmdData.news = d.articles || []; }
        if (tRes && tRes.ok) cmdData.tools = await tRes.json();
        if (pRes && pRes.ok) cmdData.prompts = await pRes.json();
        if (mRes && mRes.ok) cmdData.models = await mRes.json();
        cmdDataLoaded = true;
      } catch (e) {
        console.warn('Failed loading cmd palette data', e);
      }
    }

    function openCmdPalette() {
      cmdOverlay.classList.add('active');
      cmdInput.value = '';
      ensureCmdData().then(() => renderCmdResults(''));
      setTimeout(() => cmdInput.focus(), 50);
    }

    function closeCmdPalette() {
      cmdOverlay.classList.remove('active');
    }

    function renderCmdResults(query) {
      const q = query.toLowerCase().trim();
      let resultsHtml = '';
      let items = [];

      // Default Navigation Actions
      const actions = [
        { type: 'action', title: 'Go to News Digest', sub: 'index.html', link: 'index.html', icon: '📰' },
        { type: 'action', title: 'Go to AI Tools Directory', sub: 'tools.html', link: 'tools.html', icon: '🛠️' },
        { type: 'action', title: 'Go to Prompt Library', sub: 'prompts.html', link: 'prompts.html', icon: '💬' },
        { type: 'action', title: 'Go to Models Leaderboard', sub: 'models.html', link: 'models.html', icon: '📊' },
        { type: 'action_theme', title: 'Toggle Theme (Dark / Light)', sub: 'Action', icon: '🌓' },
      ];

      if (!q) {
        resultsHtml += `<div class="cmd-group-title">Quick Actions</div>`;
        actions.forEach((a, i) => {
          items.push(a);
          resultsHtml += `
            <div class="cmd-item ${i === 0 ? 'selected' : ''}" data-cmd-idx="${i}" data-action="${a.type}" data-link="${a.link || ''}">
              <div class="cmd-item-left">
                <div class="cmd-item-icon">${a.icon}</div>
                <div class="cmd-item-text">
                  <div class="cmd-item-title">${a.title}</div>
                  <div class="cmd-item-sub">${a.sub}</div>
                </div>
              </div>
              <span class="cmd-item-tag">Action</span>
            </div>
          `;
        });
      } else {
        // Filter across datasets
        const matchModels = (cmdData.models.length ? cmdData.models : allModels).filter(m => m.name.toLowerCase().includes(q) || m.provider.toLowerCase().includes(q)).slice(0, 4);
        const matchNews = cmdData.news.filter(n => n.title.toLowerCase().includes(q)).slice(0, 4);
        const matchTools = cmdData.tools.filter(t => t.title.toLowerCase().includes(q) || (t.category && t.category.toLowerCase().includes(q))).slice(0, 4);
        const matchPrompts = cmdData.prompts.filter(p => p.title.toLowerCase().includes(q)).slice(0, 4);

        if (matchModels.length) {
          resultsHtml += `<div class="cmd-group-title">AI Models</div>`;
          matchModels.forEach(m => {
            const idx = items.length;
            items.push({ type: 'model', data: m });
            resultsHtml += `
              <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="model" data-id="${m.id}">
                <div class="cmd-item-left">
                  <div class="cmd-item-icon">📊</div>
                  <div class="cmd-item-text">
                    <div class="cmd-item-title">${m.name}</div>
                    <div class="cmd-item-sub">${m.provider} · Elo ${m.arena_elo}</div>
                  </div>
                </div>
                <span class="cmd-item-tag">Model</span>
              </div>
            `;
          });
        }

        if (matchNews.length) {
          resultsHtml += `<div class="cmd-group-title">News Articles</div>`;
          matchNews.forEach(n => {
            const idx = items.length;
            items.push({ type: 'news', data: n });
            resultsHtml += `
              <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="link" data-link="${n.link}">
                <div class="cmd-item-left">
                  <div class="cmd-item-icon">📰</div>
                  <div class="cmd-item-text">
                    <div class="cmd-item-title">${n.title}</div>
                    <div class="cmd-item-sub">${n.source}</div>
                  </div>
                </div>
                <span class="cmd-item-tag">News</span>
              </div>
            `;
          });
        }

        if (matchTools.length) {
          resultsHtml += `<div class="cmd-group-title">AI Tools</div>`;
          matchTools.forEach(t => {
            const idx = items.length;
            items.push({ type: 'tool', data: t });
            resultsHtml += `
              <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="link" data-link="${t.link}">
                <div class="cmd-item-left">
                  <div class="cmd-item-icon">🛠️</div>
                  <div class="cmd-item-text">
                    <div class="cmd-item-title">${t.title}</div>
                    <div class="cmd-item-sub">${t.category || 'Tool'}</div>
                  </div>
                </div>
                <span class="cmd-item-tag">Tool</span>
              </div>
            `;
          });
        }

        if (matchPrompts.length) {
          resultsHtml += `<div class="cmd-group-title">Prompts</div>`;
          matchPrompts.forEach(p => {
            const idx = items.length;
            items.push({ type: 'prompt', data: p });
            resultsHtml += `
              <div class="cmd-item ${idx === 0 ? 'selected' : ''}" data-cmd-idx="${idx}" data-action="prompt" data-title="${p.title}">
                <div class="cmd-item-left">
                  <div class="cmd-item-icon">💬</div>
                  <div class="cmd-item-text">
                    <div class="cmd-item-title">${p.title}</div>
                    <div class="cmd-item-sub">${p.category}</div>
                  </div>
                </div>
                <span class="cmd-item-tag">Prompt</span>
              </div>
            `;
          });
        }

        if (!items.length) {
          resultsHtml = `<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.85em;">No results found for "${query}"</div>`;
        }
      }

      cmdResults.innerHTML = resultsHtml;
      activeCmdIndex = 0;
    }

    cmdInput.addEventListener('input', e => renderCmdResults(e.target.value));

    // Keyboard Shortcuts for Command Palette
    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (cmdOverlay.classList.contains('active')) closeCmdPalette();
        else openCmdPalette();
        return;
      }
      if (e.key === 'Escape') {
        if (cmdOverlay.classList.contains('active')) { closeCmdPalette(); return; }
        if (bmOverlay.classList.contains('active')) { bmOverlay.classList.remove('active'); return; }
        if (panel.classList.contains('active')) { closePanel(); return; }
      }
      if (cmdOverlay.classList.contains('active')) {
        const items = cmdResults.querySelectorAll('.cmd-item');
        if (!items.length) return;

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          items[activeCmdIndex]?.classList.remove('selected');
          activeCmdIndex = (activeCmdIndex + 1) % items.length;
          items[activeCmdIndex]?.classList.add('selected');
          items[activeCmdIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          items[activeCmdIndex]?.classList.remove('selected');
          activeCmdIndex = (activeCmdIndex - 1 + items.length) % items.length;
          items[activeCmdIndex]?.classList.add('selected');
          items[activeCmdIndex]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
          e.preventDefault();
          items[activeCmdIndex]?.click();
        }
      }
    });

    btnCmdPalette.addEventListener('click', openCmdPalette);
    cmdOverlay.addEventListener('click', e => { if (e.target === cmdOverlay) closeCmdPalette(); });

    cmdResults.addEventListener('click', e => {
      const item = e.target.closest('.cmd-item');
      if (!item) return;
      const action = item.dataset.action;
      if (action === 'action_theme') {
        toggleTheme();
        closeCmdPalette();
      } else if (action === 'link' || action === 'action') {
        const link = item.dataset.link;
        if (link) window.location.href = link;
      } else if (action === 'model') {
        const id = item.dataset.id;
        const m = allModels.find(x => x.id === id);
        if (m) selectModel(m);
        closeCmdPalette();
      } else if (action === 'prompt') {
        window.location.href = 'prompts.html';
      }
    });

    // Start
    loadData();
  </script>
</body>
</html>
