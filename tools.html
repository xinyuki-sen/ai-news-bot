<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Tools Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 30px 40px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.8em; background: linear-gradient(90deg, #58a6ff, #a371f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
  .date { color: #8b949e; font-size: 0.85em; margin-bottom: 20px; }
  nav { margin-bottom: 10px; }
  nav a { color: #58a6ff; text-decoration: none; font-size: 0.9em; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
  .tab { padding: 6px 14px; border-radius: 20px; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-size: 0.8em; cursor: pointer; }
  .tab.active { background: #58a6ff; color: #0d1117; border-color: #58a6ff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; height: 100px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .card a { color: #e6edf3; text-decoration: none; font-weight: 600; font-size: 0.95em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card a:hover { color: #58a6ff; }
  .badge { padding: 3px 10px; border-radius: 20px; background: #21262d; color: #8b949e; font-size: 0.72em; width: fit-content; }
  .empty-state { text-align: center; color: #8b949e; padding: 60px 0; }
</style>
</head>
<body>

<script>
const tools = [{"title": "Calerto for Mac", "link": "https://www.producthunt.com/products/calerto-meeting-alarms", "category": "Other"}, {"title": "LinkFlick", "link": "https://www.producthunt.com/products/linkflick", "category": "Other"}, {"title": "Youkti", "link": "https://www.producthunt.com/products/youkti", "category": "Other"}, {"title": "Marked Share", "link": "https://www.producthunt.com/products/marked-share", "category": "Video"}, {"title": "ABrush", "link": "https://www.producthunt.com/products/abrush-ai-2", "category": "Image"}, {"title": "VoxelWall", "link": "https://www.producthunt.com/products/voxelwall", "category": "Audio"}, {"title": "Kabza", "link": "https://www.producthunt.com/products/kabza", "category": "Other"}, {"title": "SUDARI", "link": "https://www.producthunt.com/products/sudari", "category": "Other"}, {"title": "QApilot MCP for Android", "link": "https://www.producthunt.com/products/qapilot", "category": "Coding"}, {"title": "Relic", "link": "https://www.producthunt.com/products/relic-copy-vault", "category": "Other"}, {"title": "Work Life Panda", "link": "https://www.producthunt.com/products/work-life-panda", "category": "Productivity"}, {"title": "Wokyintosh", "link": "https://www.producthunt.com/products/wokyintosh", "category": "Other"}, {"title": "Cortex", "link": "https://www.producthunt.com/products/cortex-25", "category": "Other"}, {"title": "Stackness", "link": "https://www.producthunt.com/products/stackness", "category": "Other"}, {"title": "FrameSketch", "link": "https://www.producthunt.com/products/framesketch", "category": "Other"}, {"title": "Captain Kill Switch", "link": "https://www.producthunt.com/products/captain-kill-switch", "category": "Other"}, {"title": "Raycast 2.0", "link": "https://www.producthunt.com/products/raycast", "category": "Other"}, {"title": "Wisry", "link": "https://www.producthunt.com/products/wisry", "category": "Other"}, {"title": "Loqua", "link": "https://www.producthunt.com/products/loqua", "category": "Other"}, {"title": "Sliick", "link": "https://www.producthunt.com/products/sliick", "category": "Video"}, {"title": "easyspecs.ai", "link": "https://www.producthunt.com/products/easyspecs-ai", "category": "Other"}, {"title": "Anysite.io", "link": "https://www.producthunt.com/products/anysite", "category": "Chatbot/Assistant"}, {"title": "Jackalope", "link": "https://www.producthunt.com/products/jackalope", "category": "Coding"}, {"title": "Cadenya", "link": "https://www.producthunt.com/products/cadenya-the-agent-runtime", "category": "Chatbot/Assistant"}, {"title": "chat-recall", "link": "https://www.producthunt.com/products/chat-recall", "category": "Other"}, {"title": "Devin Voice", "link": "https://www.producthunt.com/products/devin-voice", "category": "Audio"}, {"title": "Cline Desktop App", "link": "https://www.producthunt.com/products/cline-4", "category": "Other"}, {"title": "LiveGrid", "link": "https://www.producthunt.com/products/livegrid-4", "category": "Other"}, {"title": "TIM PG", "link": "https://www.producthunt.com/products/tim-pg", "category": "Research"}, {"title": "Moji", "link": "https://www.producthunt.com/products/moji-2", "category": "Other"}];
const categories = ["Audio", "Chatbot/Assistant", "Coding", "Image", "Other", "Productivity", "Research", "Video"];
let activeCat = "All";

function renderTabs() {
  const all = ["All", ...categories];
  document.getElementById('tabs').innerHTML = all.map(c =>
    `<div class="tab ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</div>`
  ).join('');
}

function setCat(c) { activeCat = c; renderTabs(); renderGrid(); }

function renderGrid() {
  const filtered = activeCat === "All" ? tools : tools.filter(t => t.category === activeCat);
  const gridEl = document.getElementById('grid');
  if (filtered.length === 0) {
    gridEl.innerHTML = '<div class="empty-state">No tools in this category yet.</div>';
    return;
  }
  gridEl.innerHTML = filtered.map(t =>
    `<div class="card">
       <a href="${t.link}" target="_blank">${t.title}</a>
       <div class="badge">${t.category}</div>
     </div>`
  ).join('');
}

renderTabs();
renderGrid();
</script>
</body></html>
