<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tools Directory — AI News Digest</title>
  <meta name="description" content="A curated directory of the latest AI tools across coding, image, audio, video, productivity, and more.">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="AI Tools Directory">
  <meta property="og:description" content="A curated directory of the latest AI tools across coding, image, audio, video, productivity, and more.">
  <meta property="og:url" content="https://xinyuki-sen.github.io/ai-news-bot/tools.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="AI Tools Directory">
  <meta name="twitter:description" content="Curated AI tools — coding, image, audio, video, productivity, and more.">

  <!-- Emoji favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">

  <style>
    /* ── CSS Variables ──────────────────────────────────────────────── */
    :root {
      --bg:           #0d1117;
      --surface:      #161b22;
      --surface2:     #21262d;
      --border:       #30363d;
      --text:         #c9d1d9;
      --text-strong:  #e6edf3;
      --text-muted:   #8b949e;
      --accent:       #58a6ff;
      --accent2:      #a371f7;
    }
    [data-theme="light"] {
      --bg:           #ffffff;
      --surface:      #f6f8fa;
      --surface2:     #eaeef2;
      --border:       #d0d7de;
      --text:         #24292f;
      --text-strong:  #1f2328;
      --text-muted:   #656d76;
      --accent:       #0969da;
      --accent2:      #8250df;
    }

    /* ── Reset ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: 70px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar .logo { font-size: 1.6em; margin-bottom: 14px; user-select: none; }
    .sidebar .spacer { flex: 1; }
    .sb-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      font-size: 1.2em;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      position: relative;
    }
    .sb-btn:hover, .sb-btn.active {
      background: var(--surface2);
      color: var(--text-strong);
    }
    .sb-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      left: calc(100% + 10px); top: 50%;
      transform: translateY(-50%);
      background: var(--surface2);
      color: var(--text-strong);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75em;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 100;
    }
    .sb-btn[data-tooltip]:hover::after { opacity: 1; }

    /* ── Main ────────────────────────────────────────────────────────── */
    .main { flex: 1; padding: 30px 40px; min-width: 0; }
    h1 {
      font-size: 1.8em;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .date { color: var(--text-muted); font-size: 0.85em; margin-bottom: 22px; }

    /* ── Search ─────────────────────────────────────────────────────── */
    .topbar { margin-bottom: 24px; }
    .search-wrap { position: relative; max-width: 480px; }
    .search-wrap label {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
    }
    .search {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px 10px 38px;
      color: var(--text);
      font-size: 0.95em;
      transition: border-color 0.15s;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }
    .search::placeholder { color: var(--text-muted); }

    /* ── Tabs ───────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8em;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
    [data-theme="light"] .tab.active { color: #fff; }
    .tab-count {
      display: inline-block;
      background: rgba(0,0,0,0.15);
      border-radius: 10px;
      padding: 0 6px;
      font-size: 0.85em;
      margin-left: 4px;
    }
    .tab.active .tab-count { background: rgba(0,0,0,0.2); }

    /* ── Grid ───────────────────────────────────────────────────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card a {
      color: var(--text-strong);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.93em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }
    .card a:hover { color: var(--accent); }
    .card-desc {
      color: var(--text-muted);
      font-size: 0.78em;
      line-height: 1.5;
      margin: 6px 0 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.72em;
      border: 1px solid var(--border);
      width: fit-content;
    }

    /* ── Skeleton ───────────────────────────────────────────────────── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ── Error / Empty ──────────────────────────────────────────────── */
    .error-state {
      text-align: center; padding: 60px 20px; display: none;
    }
    .error-state.show { display: block; }
    .error-state .err-icon { font-size: 2.5em; margin-bottom: 12px; }
    .error-state p { color: var(--text-muted); margin-bottom: 16px; }
    .btn-retry {
      background: var(--accent); color: #0d1117; border: none;
      border-radius: 8px; padding: 8px 20px; font-weight: 600; cursor: pointer; font-size: 0.9em;
    }
    [data-theme="light"] .btn-retry { color: #fff; }
    .empty-state { grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 60px 0; display: none; }
    .empty-state.show { display: block; }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .main { padding: 20px 16px; }
      .sidebar { width: 52px; }
      .sb-btn { width: 36px; height: 36px; font-size: 1em; }
    }
  </style>
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <nav class="sidebar" aria-label="Main navigation">
    <div class="logo" aria-hidden="true">🤖</div>
    <a href="index.html" class="sb-btn" aria-label="Home — News Digest" data-tooltip="News">🏠</a>
    <a href="tools.html" class="sb-btn active" aria-label="AI Tools Directory" data-tooltip="Tools">🛠️</a>
    <div class="spacer"></div>
    <button class="sb-btn" id="btnTheme" aria-label="Toggle light/dark mode" data-tooltip="Theme">🌙</button>
  </nav>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <main class="main">
    <h1>🛠️ AI Tools Directory</h1>
    <div class="date" id="dateBar">Loading…</div>

    <div class="topbar">
      <div class="search-wrap">
        <label for="toolSearch">Search tools</label>
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input class="search" id="toolSearch" type="search" placeholder="Search tool name, category, or description…" autocomplete="off">
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Filter by category"></div>
    <div class="grid" id="grid" role="list" aria-live="polite" aria-label="AI Tools"></div>
    <div class="error-state" id="errorState" role="alert">
      <div class="err-icon">⚠️</div>
      <p>Could not load tools. Please check your connection and try again.</p>
      <button class="btn-retry" id="btnRetry">Retry</button>
    </div>
  </main>

<script>
/* ── Theme ────────────────────────────────────────────────────────────── */
const savedTheme = localStorage.getItem('aind_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
const btnTheme = document.getElementById('btnTheme');
btnTheme.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
btnTheme.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('aind_theme', next);
  btnTheme.textContent = next === 'dark' ? '🌙' : '☀️';
});

/* ── State ────────────────────────────────────────────────────────────── */
let allTools = [];
let activeCategory = 'All';

/* ── Skeleton ─────────────────────────────────────────────────────────── */
function renderSkeletons(n = 12) {
  document.getElementById('grid').innerHTML = Array.from({ length: n }, () => `
    <div class="skeleton-card" aria-hidden="true">
      <div class="skel" style="height:14px; width:70%;"></div>
      <div class="skel" style="height:12px; width:90%;"></div>
      <div class="skel" style="height:12px; width:60%;"></div>
      <div style="flex:1;"></div>
      <div class="skel" style="height:22px; width:70px; border-radius:20px;"></div>
    </div>
  `).join('');
}

/* ── Render ───────────────────────────────────────────────────────────── */
function getFiltered() {
  const q = document.getElementById('toolSearch').value.trim().toLowerCase();
  return allTools.filter(t => {
    const matchCat = activeCategory === 'All' || t.category === activeCategory;
    const matchQ = !q ||
      t.title.toLowerCase().includes(q) ||
      t.category.toLowerCase().includes(q) ||
      (t.description || '').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const tools = getFiltered();
  if (tools.length === 0) {
    grid.innerHTML = '<div class="empty-state show">No tools found. Try a different search or category.</div>';
    return;
  }
  grid.innerHTML = tools.map(t => `
    <article class="card" role="listitem">
      <div>
        <a href="${t.link}" target="_blank" rel="noopener noreferrer" aria-label="${t.title} — opens in new tab">${t.title}</a>
        ${t.description ? `<div class="card-desc">${t.description}</div>` : ''}
      </div>
      <span class="badge">${t.category}</span>
    </article>
  `).join('');
}

function renderTabs() {
  const counts = {};
  allTools.forEach(t => { counts[t.category] = (counts[t.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort()];

  const tabs = document.getElementById('tabs');
  tabs.innerHTML = cats.map(cat => {
    const count = cat === 'All' ? allTools.length : counts[cat];
    return `<button class="tab${activeCategory === cat ? ' active' : ''}" role="tab" aria-selected="${activeCategory === cat}" data-cat="${cat}">${cat}<span class="tab-count">${count}</span></button>`;
  }).join('');

  tabs.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeCategory = tab.dataset.cat;
      renderTabs();
      renderGrid();
    });
  });
}

/* ── Search ───────────────────────────────────────────────────────────── */
let searchTimeout;
document.getElementById('toolSearch').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderGrid, 200);
});

/* ── Load ─────────────────────────────────────────────────────────────── */
async function loadTools() {
  renderSkeletons();
  document.getElementById('errorState').classList.remove('show');

  try {
    const res = await fetch('tools.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allTools = await res.json();

    const now = new Date();
    document.getElementById('dateBar').textContent =
      `Last updated: ${now.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}`;

    renderTabs();
    renderGrid();
  } catch (err) {
    console.error('Failed to load tools:', err);
    document.getElementById('grid').innerHTML = '';
    document.getElementById('errorState').classList.add('show');
  }
}

document.getElementById('btnRetry').addEventListener('click', loadTools);
loadTools();
</script>
</body>
</html>
