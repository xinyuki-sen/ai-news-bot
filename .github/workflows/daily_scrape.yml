name: Daily AI News Scrape

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # Get your code (from main - this never gets modified by the bot)
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Try to grab yesterday's memory notebook from gh-pages branch
      # (so we don't repeat old news). If it doesn't exist yet, that's fine.
      - name: Restore previous database
        run: |
          git fetch origin gh-pages || true
          git show origin/gh-pages:seen_posts.db > seen_posts.db 2>/dev/null || echo "No previous database found, starting fresh"

      - name: Run AI News Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ai_news_bot.py

      # Put the bot's output (webpage + data + memory + assets) into their own folder
      - name: Prepare output folder
        run: |
          mkdir -p site
          cp -r assets site/ || true
          cp index.html site/
          cp tools.html site/
          cp news.json site/
          cp tools.json site/
          cp seen_posts.db site/

      # Publish that folder to gh-pages branch ONLY - never touches main
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
